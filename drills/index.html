const LESSONS = {"vocab-in-context":{"title":"Vocabulary in Context","icon":"📖","domain":"Craft and Structure","concept":["Predict your OWN word for the blank before reading the choices — then match.","The sentence always hides the answer: look for a definition (often after a colon), an example, or a contrast.","Watch pivot words. \u003cb>Although, however, but, far from, unlike\u003c/b> mean the blank flips to the OPPOSITE of the nearby idea."],"example":{"q":"“Although praised as inventive, the dialogue felt ______, echoing older films.”","work":"“Although” flips it: inventive → the opposite. Echoing older films = copied. Predict “unoriginal” → match: \u003cb>derivative\u003c/b>."},"checks":[{"stem":"“Far from being ______, the lecture was packed with vivid stories.”","choices":["dull","informative","lengthy","popular"],"answer":"A","expl":"“Far from being X” flips to the opposite of “packed with vivid stories” → dull."},{"stem":"“The evidence was ______: every trial reached the identical result.”","choices":["disputed","conclusive","surprising","outdated"],"answer":"B","expl":"The colon defines the blank — identical results = conclusive."}]},"text-purpose":{"title":"Function of a Sentence","icon":"🎯","domain":"Craft and Structure","concept":["Ask what the sentence DOES, not what it says: give an example? raise an objection? offer evidence? draw a conclusion?","Underline the transition — it usually announces the function (“for example”, “however”, “therefore”).","Match the verb in the answer choice to that job (“illustrates”, “challenges”, “supports”)."],"example":{"q":"After a claim that the brain is fixed, a sentence begins “However, taxi-driver studies showed measurable growth…”","work":"“However” + contradicting data → the sentence \u003cb>presents evidence that complicates the earlier claim\u003c/b>."},"checks":[{"stem":"A paragraph praises a policy, then: “Critics, however, point to rising costs.” That sentence…","choices":["restates the praise","introduces a counterpoint","gives an example of success","concludes the argument"],"answer":"B","expl":"“However” + critics = a counterpoint."},{"stem":"“For instance, the 1994 flood destroyed three bridges.” This sentence…","choices":["makes a general claim","offers a specific example","raises a question","disagrees with the last sentence"],"answer":"B","expl":"“For instance” always signals an example."}]},"cross-text":{"title":"Cross-Text Connections","icon":"🔗","domain":"Craft and Structure","concept":["Nail each text's MAIN claim in a few words before comparing.","Decide the relationship: agree, disagree, one qualifies/extends the other, one gives evidence the other lacks.","The answer must be true to BOTH texts — eliminate any choice that misreads either one."],"example":{"q":"Text 1: crop rotation is an ancient practice. Text 2: little evidence early farmers understood WHY it worked; custom drove it.","work":"Text 2 doesn't deny rotation's benefits — it questions whether early farmers understood the mechanism. They \u003cb>focus on different aspects\u003c/b>."},"checks":[{"stem":"Text 1 says a poem is about grief; Text 2 says it's about memory. Author 2 would most likely say Author 1…","choices":["is completely wrong","overlooks the role of memory","agrees entirely","misquoted the poem"],"answer":"B","expl":"Author 2 adds a dimension (memory) rather than rejecting grief outright."},{"stem":"Two texts reach the same conclusion with different data. Their relationship is best called…","choices":["contradiction","mutual support","unrelated","restatement"],"answer":"B","expl":"Same conclusion, independent evidence = mutual support."}]},"central-ideas":{"title":"Main Idea & Details","icon":"🧭","domain":"Information and Ideas","concept":["The main idea covers the WHOLE text — not one detail, and never contradicts a stated fact.","Wrong answers: too narrow (one detail), too broad (beyond the text), or a distortion (flips a detail).","For literary passages, translate figurative language into plain meaning first."],"example":{"q":"Coral expels its algae under heat stress; since the algae feed it, a bleached coral is starving, not dead, and can recover if waters cool.","work":"One line covering it all: \u003cb>bleaching starves coral but is survivable if temperatures drop in time\u003c/b>. “Permanently dead” contradicts the text."},"checks":[{"stem":"A text explains how vaccines train the immune system using a harmless fragment. Main idea?","choices":["Vaccines are dangerous","Vaccines teach immunity using a harmless piece of a germ","The immune system never forgets","Fragments are alive"],"answer":"B","expl":"The choice that captures the whole mechanism without distortion."},{"stem":"Which is a sign of a WRONG main-idea choice?","choices":["It covers the whole passage","It focuses on a single supporting detail","It matches the author's tone","It is stated in the topic sentence"],"answer":"B","expl":"Too-narrow (one detail) is the classic trap."}]},"command-of-evidence":{"title":"Command of Evidence","icon":"🔎","domain":"Information and Ideas","concept":["First, state the exact claim in your own words — note its topic AND direction.","The right evidence directly addresses THAT claim; nice-sounding facts about the general topic are decoys.","For data/graph questions, check the finding matches the claim's variable, time window, and direction."],"example":{"q":"Claim: community gardens cut households' grocery spending.","work":"Only a finding about SPENDING can support it. “Produce spending averaged 15% less than similar non-gardening households” hits the claim; higher satisfaction or property values don't."},"checks":[{"stem":"Claim: a tutoring program raises test scores. Best support?","choices":["Students enjoyed the program","Participants scored 12% higher than a comparison group","The program was inexpensive","Attendance was high"],"answer":"B","expl":"Only the score comparison addresses the score claim."},{"stem":"Claim: remote work has plateaued since 2023. Best support?","choices":["Remote postings surged in 2021","The remote share held at 13–15% every quarter since 2023","Workers prefer hybrid","Coworking spaces doubled"],"answer":"B","expl":"“Plateaued” needs a flat trend across the stated window."}]},"inference":{"title":"Inference & Logical Completion","icon":"🧩","domain":"Information and Ideas","concept":["Stay inside the text — a valid inference is forced by what's written, not by outside knowledge.","For “most logically completes,” the ending must follow from the clues, often combining TWO of them.","If a choice uses only half the evidence, it loses to the one that uses all of it."],"example":{"q":"Dimming streetlights after midnight: insects are most active then (helps them) AND traffic is light (won't hurt drivers). So the program will…","work":"Combine both clues → \u003cb>reduce harm to insects without much affecting drivers\u003c/b>. A choice about only insects OR only drivers is incomplete."},"checks":[{"stem":"Fish-drying racks far exceed the village's own needs; mainland ledgers list the village's salted fish often. So the village likely…","choices":["couldn't feed itself","produced dried fish for trade","had a huge population","stopped fishing"],"answer":"B","expl":"Both clues point to production for trade."},{"stem":"A good inference is one that…","choices":["uses outside facts you know","is forced by the text's own statements","sounds dramatic","restates the title"],"answer":"B","expl":"Inferences must be grounded in the passage."}]},"subject-verb":{"title":"Subject–Verb Agreement","icon":"✏️","domain":"Standard English Conventions","concept":["Find the TRUE subject, then cross out everything between it and the verb.","Prepositional phrases (“of the students”), “including…”, and “along with…” never change the subject's number.","“Each,” “every,” “one,” “neither” are singular — always."],"example":{"q":"“The bouquet of roses and lilies ______ on the table.”","work":"Cross out “of roses and lilies.” Subject = bouquet (singular) → \u003cb>was\u003c/b>."},"checks":[{"stem":"“Each of the players ______ a locker.” Choose the verb.","choices":["have","has","were","own"],"answer":"B","expl":"“Each” is singular → has."},{"stem":"“The box of old photographs ______ in the attic.”","choices":["were","are","was","have been"],"answer":"C","expl":"Subject = box (singular), not photographs → was."}]},"modifiers":{"title":"Dangling & Misplaced Modifiers","icon":"🪝","domain":"Standard English Conventions","concept":["An opening “-ing/-ed” phrase + comma must be followed immediately by the person or thing doing it.","Ask “who is doing this?” — that noun starts the main clause.","Objects (phones, applications, letters) can't run, hope, or qualify — a person must."],"example":{"q":"“Running to catch the bus, ______”","work":"Who's running? Maya. So it must be \u003cb>Maya dropped her phone\u003c/b>, not “Maya's phone slipped.”"},"checks":[{"stem":"“Exhausted after the hike, ______”","choices":["the tent felt welcome to us","we were glad to see the tent","the trail seemed endless","it was time to rest"],"answer":"B","expl":"Who's exhausted? We — so “we” must follow the comma."},{"stem":"“To win the contest, ______”","choices":["strong entries are required","the rules must be followed","contestants must submit early","there is a deadline"],"answer":"C","expl":"Who wins? Contestants — they must follow the comma."}]},"punctuation":{"title":"Punctuation & Boundaries","icon":"❯","domain":"Standard English Conventions","concept":["Two complete sentences join with: a period, a semicolon, or a comma + FANBOYS conjunction. A bare comma is a splice.","Nonessential info takes a matching PAIR of punctuation — comma…comma, dash…dash, or ( … ).","A colon needs a complete sentence before it; it introduces a list, explanation, or example."],"example":{"q":"“My neighbor's dog, a golden retriever ______ greets everyone.”","work":"The appositive opened with a comma, so it must close with one → \u003cb>retriever,\u003c/b> (comma…comma pair)."},"checks":[{"stem":"“The tide rose fast ______ the crew hurried.” (two complete sentences)","choices":["fast, the","fast; the","fast the","fast, so quickly the"],"answer":"B","expl":"Two sentences need a semicolon (or comma + conjunction); a bare comma is a splice."},{"stem":"Which correctly punctuates a nonessential phrase?","choices":["The car, a rusty sedan sat idle.","The car a rusty sedan, sat idle.","The car, a rusty sedan, sat idle.","The car; a rusty sedan sat idle."],"answer":"C","expl":"Nonessential = matching comma pair around it."}]},"verb-tense":{"title":"Verb Tense","icon":"⏳","domain":"Standard English Conventions","concept":["Match tense to the time markers in the sentence.","“By the time [past event]” → something finished earlier = \u003cb>past perfect\u003c/b> (had + verb).","Keep tense consistent with the rest of the passage unless a time word signals a shift."],"example":{"q":"“By the time the pizza arrived, we ______ the salad.”","work":"The salad was finished before the pizza (a past event) → \u003cb>had finished\u003c/b>."},"checks":[{"stem":"“By the time the movie started, we ______ our popcorn.”","choices":["finish","had finished","will finish","finishes"],"answer":"B","expl":"Completed before a past event → past perfect."},{"stem":"“Every morning she ______ two miles before class.”","choices":["run","runs","had run","will run"],"answer":"B","expl":"Habitual present → runs."}]},"transitions":{"title":"Transitions","icon":"🔀","domain":"Expression of Ideas","concept":["Cover the transition and name the relationship between the two sentences in your own words.","Contrast: however, by contrast. Cause/effect: therefore, as a result, accordingly. Add: moreover, in addition. Concession: even so, nevertheless. Example: for instance.","Concession (agree-then-pivot) is the most-missed: it admits a point, then pushes past it."],"example":{"q":"“The recipe is time-consuming. ______ bakers say it's worth it.”","work":"Admit the downside, then pivot to the upside = concession → \u003cb>Even so,\u003c/b>."},"checks":[{"stem":"“Prices fell sharply. ______ labor costs stayed high.”","choices":["Therefore,","However,","For example,","Likewise,"],"answer":"B","expl":"Opposition between the two facts → However."},{"stem":"“Every trial failed to replicate the result. ______ the team withdrew the claim.”","choices":["Nevertheless,","Accordingly,","Meanwhile,","In contrast,"],"answer":"B","expl":"Evidence → the action it justifies = Accordingly."}]},"rhetorical-synthesis":{"title":"Rhetorical Synthesis","icon":"🧷","domain":"Expression of Ideas","concept":["Read the GOAL first (emphasize a contrast? introduce a topic? present a finding?).","Pick the sentence that accomplishes that specific goal using the notes — not the most interesting fact.","Eliminate choices that are accurate but off-goal."],"example":{"q":"Goal: emphasize the EFFECT of a library renovation. Notes include a 30% rise in visits after it.","work":"The sentence must link renovation → the rise: \u003cb>“Since its renovation, visits have risen 30%.”\u003c/b> The 1912 opening date is off-goal."},"checks":[{"stem":"Goal: contrast two artists' styles. Best choice?","choices":["Both artists were born in Ohio.","While Lee works in bold color, Rao favors fine pencil lines.","Both became famous young.","Art is subjective."],"answer":"B","expl":"Only this one draws the contrast the goal asks for."},{"stem":"First step in a rhetorical-synthesis question?","choices":["Pick the longest choice","Read the stated goal","Choose the most surprising fact","Ignore the notes"],"answer":"B","expl":"The goal governs everything."}]},"linear-models":{"title":"Interpreting Linear Models","icon":"📈","domain":"Algebra","concept":["In y = mx + b: the coefficient m is the RATE (per unit); b is the STARTING value (at x = 0).","Read the units from the story to name each part.","“Per hour / per week / each” signals the slope; a flat fee or deposit signals the intercept."],"example":{"q":"C = 40 + 55h dollars for h hours.","work":"55 multiplies h → \u003cb>$55 per hour\u003c/b>. 40 is the fixed charge at h = 0."},"checks":[{"stem":"P = 12 + 3w (plant height, w weeks). The 3 means…","choices":["starts at 3 cm","grows 3 cm per week","measured every 3 weeks","stops at 3 weeks"],"answer":"B","expl":"Coefficient on the variable = rate."},{"stem":"In C = 40 + 55h, the 40 means…","choices":["$40 per hour","a fixed $40 charge","40 hours max","40 minutes"],"answer":"B","expl":"Constant term = value at h = 0, a fixed fee."}]},"slope-two-points":{"title":"Slope & Line from Two Points","icon":"📐","domain":"Algebra","concept":["Slope = (y₂ − y₁) / (x₂ − x₁). Keep the subtraction order the SAME top and bottom.","Find b by plugging one point into y = mx + b.","Always verify with the SECOND point — traps pass through only one."],"example":{"q":"Line through (1, 4) and (3, 10).","work":"m = (10−4)/(3−1) = 3. Then 4 = 3(1) + b → b = 1. Check (3,10): 3·3+1 = 10 ✓ → \u003cb>y = 3x + 1\u003c/b>."},"checks":[{"stem":"Slope through (−2, 7) and (4, −5)?","choices":["−2","2","−1/2","−12"],"answer":"A","expl":"(−5−7)/(4−(−2)) = −12/6 = −2."},{"stem":"After finding a line's equation you should…","choices":["stop","check it against the second point","double the slope","swap x and y"],"answer":"B","expl":"Verifying with the second point catches the classic trap."}]},"systems":{"title":"Systems of Equations","icon":"⚖️","domain":"Algebra","concept":["Add or subtract the equations to eliminate a variable when coefficients line up (e.g., +2y and −2y).","Substitute back for the second variable.","Re-read the question — it may want x + y or 2x, not just x."],"example":{"q":"x + 2y = 11 and 3x − 2y = 1.","work":"Add → 4x = 12 → x = 3; then y = 4. If it asks x + y → \u003cb>7\u003c/b>."},"checks":[{"stem":"x + y = 10 and x − y = 4. Find x.","choices":["3","7","5","6"],"answer":"B","expl":"Add: 2x = 14 → x = 7."},{"stem":"Parallel lines (same slope, different intercept) have how many solutions?","choices":["one","none","infinitely many","two"],"answer":"B","expl":"Parallel = never intersect = no solution."}]},"inequalities":{"title":"Inequalities from Context","icon":"🔢","domain":"Algebra","concept":["Translate “at most” → ≤, “at least” → ≥, then solve like an equation.","Include every fixed amount (a driver's weight, a base fee) before dividing.","“At most / greatest number” → round DOWN to a whole number."],"example":{"q":"Van holds ≤ 900 lb; driver 180 lb; boxes 35 lb each.","work":"35b + 180 ≤ 900 → b ≤ 20.6 → \u003cb>20 boxes\u003c/b> (round down; don't forget the driver)."},"checks":[{"stem":"Elevator limit 1000 lb, operator 200 lb, crates 50 lb. Max crates?","choices":["16","20","24","15"],"answer":"A","expl":"50c + 200 ≤ 1000 → c ≤ 16."},{"stem":"“At most” with a fractional answer of 7.8 means…","choices":["round to 8","round down to 7","answer 7.8","no solution"],"answer":"B","expl":"“At most” → round down."}]},"exponent-rules":{"title":"Exponent Rules","icon":"^","domain":"Advanced Math","concept":["Multiply same base → ADD exponents. Divide → SUBTRACT. Power of a power → MULTIPLY.","A power outside parentheses hits every factor inside: (2x³)⁴ = 2⁴x¹².","Never multiply exponents for a simple product."],"example":{"q":"x⁶ · x² / x³.","work":"6 + 2 = 8, then 8 − 3 = 5 → \u003cb>x⁵\u003c/b>."},"checks":[{"stem":"(3x²)³ = ?","choices":["9x⁶","27x⁶","27x⁵","9x⁸"],"answer":"B","expl":"3³ = 27 and (x²)³ = x⁶."},{"stem":"x⁵ · x⁴ = ?","choices":["x⁹","x²⁰","x⁻¹","x"],"answer":"A","expl":"Same base, multiply → add exponents: 5 + 4 = 9."}]},"exponential-models":{"title":"Exponential Models","icon":"🚀","domain":"Advanced Math","concept":["Form: start · (factor)^(t / period). The exponent COUNTS how many times it grows.","“Triples every 5 years” → base 3, exponent t/5.","Growth multiplies; three doublings = 2³ = 8×, not 6×."],"example":{"q":"$200 triples every 5 years, value after t years?","work":"\u003cb>V = 200 · 3^(t/5)\u003c/b> — start out front, base = growth factor, exponent = t ÷ period."},"checks":[{"stem":"A population doubles every 10 hrs. After 30 hrs it is ___× the start.","choices":["3","6","8","2"],"answer":"C","expl":"Three doublings = 2³ = 8."},{"stem":"$500 grows by factor 2 every 4 years. Model?","choices":["500·2^(t/4)","500·2^(4t)","500+2^(t/4)","2·500^(t/4)"],"answer":"A","expl":"Start·factor^(t/period)."}]},"quadratic-vertex":{"title":"Quadratics: Vertex & Max/Min","icon":"⛰️","domain":"Advanced Math","concept":["Vertex form y = a(x − h)² + k → vertex at (h, k); the sign inside flips (x − 3 → h = 3).","From y = ax² + bx + c, the vertex is at x = −b/(2a); plug back in for the max/min value.","a > 0 opens up (minimum); a \u003c 0 opens down (maximum)."],"example":{"q":"h = −16t² + 96t, max height?","work":"t = −b/2a = 96/32 = 3; h(3) = −144 + 288 = \u003cb>144\u003c/b>. Find the vertex time, then substitute."},"checks":[{"stem":"Vertex of y = (x − 5)² + 2?","choices":["(5, 2)","(−5, 2)","(2, 5)","(5, −2)"],"answer":"A","expl":"(x − h) flips sign → h = 5, k = 2."},{"stem":"For y = 2x² − 8x + 1, the vertex x is…","choices":["2","−2","4","8"],"answer":"A","expl":"x = −b/2a = 8/4 = 2."}]},"radical-equations":{"title":"Radical Equations","icon":"√","domain":"Advanced Math","concept":["Isolate the root, then square both sides.","Squaring can invent false answers — ALWAYS plug each solution back into the original.","Keep only the values that actually work (no negative under an even root, no negative = positive)."],"example":{"q":"√(x + 7) = x − 5.","work":"Square → x + 7 = x² − 10x + 25 → x² − 11x + 18 = 0 → x = 2 or 9. Check: x = 2 gives √9 = −3 ✗; only \u003cb>x = 9\u003c/b> works."},"checks":[{"stem":"√(x + 2) = x. Which is a valid solution?","choices":["x = −1","x = 2","both","neither"],"answer":"B","expl":"x=2: √4=2 ✓. x=−1: √1=−1 ✗ (extraneous)."},{"stem":"Why check radical solutions in the original equation?","choices":["to save time","squaring can create false solutions","roots are always negative","it's optional"],"answer":"B","expl":"Squaring introduces extraneous roots."}]},"percent":{"title":"Percents & Reverse Percents","icon":"％","domain":"Problem-Solving and Data Analysis","concept":["A discount of p% leaves (100 − p)% of the price; tax of p% makes it (100 + p)%.","To find the ORIGINAL from a changed price, DIVIDE by the factor — don't add the percent back.","Percent up and percent down are NOT symmetric."],"example":{"q":"After 25% off, a jacket is $45. Original?","work":"Sale = 75% of original → 45 ÷ 0.75 = \u003cb>$60\u003c/b>. (Adding 25% back → $56.25 is the trap.)"},"checks":[{"stem":"With 8% tax the total is $270. Pre-tax price?","choices":["$248.40","$250","$262","$291.60"],"answer":"B","expl":"270 ÷ 1.08 = 250."},{"stem":"A price rose 20% to $60. Original price?","choices":["$48","$50","$40","$72"],"answer":"B","expl":"60 ÷ 1.20 = 50 (not 60 − 20%)."}]},"ratios-rates":{"title":"Ratios, Rates & Units","icon":"🧮","domain":"Problem-Solving and Data Analysis","concept":["Set up a proportion with matching units on top and bottom; cross-multiply.","Convert units carefully — 40 minutes is ⅔ hour, not 0.40 hour.","Check the answer's units match what's asked."],"example":{"q":"12 muffins need 3 cups flour. For 20 muffins?","work":"3/12 = x/20 → x = 5 cups (¼ cup each × 20). \u003cb>5\u003c/b>."},"checks":[{"stem":"A car goes 54 miles in 40 minutes. Miles per hour?","choices":["81","54","36","21.6"],"answer":"A","expl":"40 min = ⅔ hr; 54 ÷ ⅔ = 81."},{"stem":"3 lb for $6. Cost of 5 lb?","choices":["$9","$10","$12","$15"],"answer":"B","expl":"$2/lb × 5 = $10."}]},"stats-center":{"title":"Mean, Median & Outliers","icon":"📊","domain":"Problem-Solving and Data Analysis","concept":["Mean = sum ÷ count; median = middle value when ordered.","Outliers pull the MEAN toward them; the median barely moves.","Adding a very large/small value: mean shifts a lot, median little."],"example":{"q":"Data 7, 8 in the middle stay; one value jumps way up. What happens?","work":"Median (the middle pair) is unchanged; the sum rises so the \u003cb>mean increases\u003c/b>."},"checks":[{"stem":"Mean of 4, 6, 9, 13?","choices":["7.5","8","8.5","9"],"answer":"B","expl":"32 ÷ 4 = 8."},{"stem":"One huge outlier is added to a data set. Which moves more?","choices":["median","mean","both equally","neither"],"answer":"B","expl":"Outliers pull the mean, not the median."}]},"two-way-tables":{"title":"Two-Way Tables & Probability","icon":"🗂️","domain":"Problem-Solving and Data Analysis","concept":["Probability = (matching count) ÷ (correct total). The whole question is which total.","“AND” across the whole group → divide by the grand total.","“GIVEN / of the …” → divide by that row or column total only."],"example":{"q":"200 students; 50 are seniors who walk. P(senior who walks)?","work":"“Senior AND walks” out of ALL 200 → 50/200 = \u003cb>1/4\u003c/b>. (2/5 would be “walks, given senior.”)"},"checks":[{"stem":"120 students, 40 are 11th graders who play a sport. P(11th grader who plays)?","choices":["1/3","4/7","7/12","10/17"],"answer":"A","expl":"40/120 = 1/3 (grand total)."},{"stem":"“Of the seniors, what fraction walk?” You divide by…","choices":["the grand total","the seniors total","the walkers total","100"],"answer":"B","expl":"“Of the seniors” = conditional → seniors total."}]},"triangle-basics":{"title":"Triangle Angles & Sides","icon":"🔺","domain":"Geometry and Trigonometry","concept":["The three angles of a triangle sum to 180°.","Isosceles: equal sides face equal angles. Exterior angle = sum of the two remote interior angles.","On the digital SAT, figures are drawn to scale — use them to sanity-check."],"example":{"q":"Two angles are 42° and 71°. Third?","work":"180 − 42 − 71 = \u003cb>67°\u003c/b>."},"checks":[{"stem":"A triangle has angles 90° and 35°. The third is…","choices":["45°","55°","65°","125°"],"answer":"B","expl":"180 − 90 − 35 = 55."},{"stem":"In an isosceles triangle the two base angles are…","choices":["always 60°","equal to each other","always right angles","supplementary"],"answer":"B","expl":"Equal sides → equal base angles."}]},"circles":{"title":"Circles: Area & Circumference","icon":"⭕","domain":"Geometry and Trigonometry","concept":["Area = πr²; Circumference = 2πr. Everything routes through the radius.","Given area → solve for r → then find circumference (or vice versa).","Don't confuse the two formulas; write both down first."],"example":{"q":"Area = 36π. Circumference?","work":"πr² = 36π → r = 6 → C = 2π(6) = \u003cb>12π\u003c/b>."},"checks":[{"stem":"Circumference = 10π. Area?","choices":["10π","5π","25π","100π"],"answer":"C","expl":"2πr = 10π → r = 5 → A = 25π."},{"stem":"A circle's radius doubles. Its area becomes…","choices":["2×","3×","4×","same"],"answer":"C","expl":"Area ∝ r²; doubling r → 4× area."}]},"pythagorean":{"title":"Pythagorean Theorem","icon":"📏","domain":"Geometry and Trigonometry","concept":["a² + b² = c², where c is the hypotenuse (longest side, across from the right angle).","Finding a LEG → subtract: leg = √(c² − other²). Finding the hypotenuse → add.","Know the common triples: 3-4-5, 5-12-13, 8-15-17."],"example":{"q":"Hypotenuse 17, one leg 8. Other leg?","work":"√(17² − 8²) = √225 = \u003cb>15\u003c/b> (subtract for a leg; √353 comes from wrongly adding)."},"checks":[{"stem":"Legs 6 and 8. Hypotenuse?","choices":["10","12","14","√28"],"answer":"A","expl":"√(36 + 64) = √100 = 10 (add for the hypotenuse)."},{"stem":"Hypotenuse 13, leg 5. Other leg?","choices":["12","8","18","√194"],"answer":"A","expl":"√(169 − 25) = √144 = 12 (subtract for a leg)."}]},"right-triangle-trig":{"title":"Right-Triangle Trig (SOH-CAH-TOA)","icon":"📐","domain":"Geometry and Trigonometry","concept":["sin = opp/hyp, cos = adj/hyp, tan = opp/adj.","tan A = 3/4 means legs 3 and 4 → hypotenuse 5; read the other ratios off the triangle.","Complementary angles: sin(θ) = cos(90 − θ). So sin 35° = cos 55°."],"example":{"q":"tan A = 3/4, find sin A.","work":"Legs 3, 4 → hyp 5 (a 3-4-5). sin A = opp/hyp = \u003cb>3/5\u003c/b>."},"checks":[{"stem":"sin 40° = cos x°. x = ?","choices":["40","50","60","140"],"answer":"B","expl":"Complementary: x = 90 − 40 = 50."},{"stem":"In a right triangle, cos = 4/5. Then sin (the same angle's opposite/hyp) with legs 3,4,5 is…","choices":["3/5","4/5","5/4","3/4"],"answer":"A","expl":"adj 4, hyp 5 → opp 3 → sin = 3/5."}]}};     // baked lesson library
let ST = load();
let SERVER = { reviews: [], money: null }; // last state from server

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 2) return s; } catch (e) {}
  return { v: 2, domains: {}, seen: [], best: {}, sessions: [], pending: [], pendingLessons: [], localReviews: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
function dstat(d) { return ST.domains[d] || (ST.domains[d] = { att: 0, cor: 0 }); }
function mastery(d) { const s = ST.domains[d]; return s && s.att >= 3 ? s.cor / s.att : null; }

// ---------- server IO ----------
async function fetchPool() {
  if (!SYNC) return;
  try {
    const r = await fetch(SYNC.url + "/api/questions?k=" + encodeURIComponent(SYNC.k), { cache: "no-store" });
    if (r.ok) { const d = await r.json(); if (d.questions && d.questions.length) POOL = d.questions; }
  } catch (e) {}
}
async function fetchState() {
  if (!SYNC) return;
  try {
    const r = await fetch(SYNC.url + "/api/state?k=" + encodeURIComponent(SYNC.k) + "&student=" + STUDENT, { cache: "no-store" });
    if (r.ok) SERVER = await r.json();
  } catch (e) {}
}
function syncSession(payload) {
  if (!SYNC) return;
  ST.pending.push(payload); save(); flushPending();
}
function syncLesson(lessonId) {
  if (!SYNC) return;
  ST.pendingLessons.push({ lessonId, ts: Date.now() }); save(); flushPending();
}
let FLUSHING = false, FLUSH_AGAIN = false; // in-flight guard: overlapping flushes would re-post the same session
function flushPending() {
  if (!SYNC) return;
  if (FLUSHING) { FLUSH_AGAIN = true; return; }
  FLUSHING = true;
  const post = (path, body, onOk) =>
    fetch(SYNC.url + path, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) })
      .then((r) => { if (r.ok) { onOk(); save(); } }).catch(() => {});
  let chain = Promise.resolve();
  for (const p of ST.pending.slice(0, 8))
    chain = chain.then(() => post("/api/session", { k: SYNC.k, student: STUDENT, session: p }, () => { ST.pending = ST.pending.filter((x) => x !== p); }));
  for (const p of ST.pendingLessons.slice(0, 8))
    chain = chain.then(() => post("/api/lesson", { k: SYNC.k, student: STUDENT, lessonId: p.lessonId }, () => { ST.pendingLessons = ST.pendingLessons.filter((x) => x !== p); }));
  chain.then(fetchState).then(() => { if (VIEW === "home") renderHome(); }).catch(() => {})
    .finally(() => { FLUSHING = false; if (FLUSH_AGAIN) { FLUSH_AGAIN = false; flushPending(); } });
}

// review queue merges server truth with optimistic local completions
function pendingReviews() {
  const map = {};
  for (const r of SERVER.reviews || []) map[r.lesson_id] = { id: r.lesson_id, status: r.status, times: r.times_missed };
  for (const [id, v] of Object.entries(ST.localReviews)) map[id] = map[id] ? { ...map[id], ...v } : { id, ...v };
  return Object.values(map).filter((r) => r.status === "pending" && LESSONS[r.id]);
}

// ---------- circuit assembly ----------
function buildCircuit(len, hard) {
  let cand = POOL.filter((q) => !hard || q.diff !== "E");
  const recent = new Set(ST.seen.slice(-Math.min(30, Math.max(0, cand.length - len - 4))));
  const fresh = cand.filter((q) => !recent.has(q.id));
  if (fresh.length >= len) cand = fresh;
  const picked = [];
  let lastDom = null, secRun = 0, lastSec = null;
  for (let i = 0; i < len && cand.length; i++) {
    let opts = cand.filter((q) => q.domain !== lastDom && !(q.section === lastSec && secRun >= 2));
    if (!opts.length) opts = cand.filter((q) => q.domain !== lastDom);
    if (!opts.length) opts = cand;
    const weights = opts.map((q) => { const m = mastery(q.domain); return m == null ? 1.8 : 1 + 2 * (1 - m); });
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), q = opts[0];
    for (let j = 0; j < opts.length; j++) { r -= weights[j]; if (r <= 0) { q = opts[j]; break; } }
    picked.push(q); cand = cand.filter((x) => x.id !== q.id);
    if (q.section === lastSec) secRun++; else { secRun = 1; lastSec = q.section; }
    lastDom = q.domain;
  }
  return picked;
}

// ============ VIEWS ============
let VIEW = "home", G = null, L = null;

function render() { clearInterval(G && G.timer); if (VIEW === "home") renderHome(); }

function renderHome() {
  VIEW = "home"; clearInterval(G && G.timer);
  const doms = [...new Set(POOL.map((q) => q.domain))];
  const bars = doms.map((d) => {
    const m = mastery(d), s = ST.domains[d], pct = m == null ? 0 : Math.round(m * 100);
    return `<div class="mast"><div class="lbl"><span>${DOMAIN_ICON[d] || "•"} ${esc(d)}</span><span>${m == null ? (s && s.att ? s.att + " tried" : "—") : pct + "%"}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
  const queue = pendingReviews();
  const queueHtml = queue.length ? queue.slice(0, 8).map((r) => {
    const L = LESSONS[r.id];
    return `<button class="queue-item" data-lesson="${r.id}"><span class="ic">${L.icon || "📘"}</span>
      <span class="t"><b>${esc(L.title)}</b><br><small>${esc(L.domain)}</small></span>
      ${r.times > 1 ? `<span class="badge">missed ×${r.times}</span>` : ""}<span class="go">›</span></button>`;
  }).join("") : `<p class="footnote">Nothing to review yet — miss a question and its lesson lands here. 🎯</p>`;

  const m = SERVER.money;
  const todayMin = m ? Math.floor(m.todayMs / 60000) : Math.floor(todayLocalMs() / 60000);
  const goalMin = m ? Math.round(m.goalMs / 60000) : 30;
  const pct = Math.min(100, (todayMin / goalMin) * 100);
  const done = todayMin >= goalMin;
  const rate = m ? m.rate : 5;
  const moneyPanel = `<div class="panel payday"><h2>💵 Today's payday</h2>
    <div class="money-track"><div class="money-fill ${done ? "done" : ""}" style="width:${pct}%"></div></div>
    <div class="money-line"><span>${todayMin} of ${goalMin} min</span><span>${done ? `<b>$${rate} earned! ✓</b>` : `$${rate} at ${goalMin} min`}</span></div>
    <p class="footnote" style="margin:8px 0 0">Practice ${goalMin} minutes in a day and the adults in your life give you <b>$${rate}</b>.${m ? ` So far you've earned <b>$${m.earnedTotal}</b> across ${m.earnedDays} day${m.earnedDays === 1 ? "" : "s"}.` : ""}</p></div>`;

  const hiw = `  <details class="panel" ${ST.seenIntro ? "" : "open"}><summary style="cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:16px">ℹ️ How this works</summary>
    <div style="margin-top:12px">
    <div class="hiw"><span class="n">1</span><span>Each circuit mixes Reading, Writing, and Math and <b>changes topic every question</b> — training you to switch gears the way the real SAT makes you.</span></div>
    <div class="hiw"><span class="n">2</span><span>Every question has a shot clock set to the <b>real SAT pace</b> — about 71 sec for Reading & Writing, 95 sec for Math. Beat it for a speed bonus.</span></div>
    <div class="hiw"><span class="n">3</span><span>Miss one and its <b>lesson drops into your Study queue</b> above. Clear it by finishing the mini-lesson and its two check questions.</span></div>
    <div class="hiw"><span class="n">4</span><span>Practice <b>30 minutes in a day → $${rate}</b> from the adults in your life. Streaks, speed, and personal bests all rack up points.</span></div>
    </div></details>`;
  $("app").innerHTML = `
  <h1>⚙️ Gear Shift</h1>
  <p class="sub">SAT drills that change gears every question — just like the real test.</p>
  ${!ST.seenIntro ? `<p class="footnote" style="margin:-6px 0 10px">👋 First time here? Read this once, then hit a circuit.</p>` + hiw : ""}
  ${STUDENT !== "hudson" ? `<p class="footnote" style="margin:-8px 0 12px">🔒 Practice node: <b>${esc(STUDENT)}</b> — separate scores; nothing here touches Hudson's dashboard.</p>` : ""}
  ${moneyPanel}
  ${queue.length ? `<div class="panel"><h2>📚 Study queue <span class="footnote" style="font-weight:400">· ${queue.length} to review</span></h2>${queueHtml}</div>` : ""}
  <div class="panel">
    <h2>▶️ Start a circuit</h2>
    <div class="lenrow">
      <button data-len="8"><b>8</b><span>Quick</span></button>
      <button data-len="12"><b>12</b><span>Daily</span></button>
      <button data-len="20"><b>20</b><span>Long</span></button>
    </div>
    <label class="toggle"><input type="checkbox" id="hard-tgl"> 🔥 Hard mode — medium/hard only</label>
  </div>
  ${!queue.length ? `<div class="panel"><h2>📚 Study queue</h2>${queueHtml}</div>` : ""}
  <div class="panel"><h2>📊 Skill meter${ST.sessions.length ? ` · ${ST.sessions.length} circuit${ST.sessions.length > 1 ? "s" : ""}` : ""}</h2>${bars}</div>
  ${ST.seenIntro ? hiw : ""}
  <p class="footnote">Scoring: 100 per correct · streak ×2 at 3, ×3 at 5 · +50 speed bonus. Wrong answers always show the fix.</p>`;
  document.querySelectorAll("[data-len]").forEach((b) => b.onclick = () => startGame(+b.dataset.len, $("hard-tgl").checked));
  document.querySelectorAll("[data-lesson]").forEach((b) => b.onclick = () => startLesson(b.dataset.lesson));
}

// ---------- circuit play ----------
function startGame(len, hard) {
  if (!ST.seenIntro) { ST.seenIntro = true; save(); }
  G = { qs: buildCircuit(len, hard), i: 0, score: 0, streak: 0, bestStreak: 0, correct: 0,
    hard, lenKey: "c" + len + (hard ? "h" : ""), byDomain: {}, missed: [], resolved: false, startedAt: Date.now() };
  if (!G.qs.length) { toast("No questions available"); return; }
  VIEW = "play"; renderQ();
}
function qBody(q) {
  let b = "";
  if (q.passage) b += `<div class="passage">${(Array.isArray(q.passage) ? q.passage : [q.passage]).map((p) => `<p>${p}</p>`).join("")}</div>`;
  if (q.fig) b += `<div class="fig">${q.fig}</div>`;
  if (q.table) b += `<div class="qtable-wrap"><table class="qtable"><tr>${q.table.headers.map((h) => `<th>${h}</th>`).join("")}</tr>` +
    q.table.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("") + `</table></div>`;
  if (q.notes) b += `<ul class="notes">${q.notes.map((n) => `<li>${n}</li>`).join("")}</ul>`;
  b += `<div class="stem">${q.stem}</div><div class="choices">${q.choices.map((c, i) =>
    `<button class="choice" data-l="${LET[i]}"><span class="cl">${LET[i]}</span><span>${c}</span></button>`).join("")}</div><div id="verdict"></div>`;
  return b;
}
function renderQ() {
  const q = G.qs[G.i]; G.resolved = false; G.t0 = Date.now();
  const shot = SHOT[q.section] || 80000; G.deadline = G.t0 + shot;
  const sec = q.section === "RW" ? "Reading & Writing" : "Math";
  $("app").innerHTML = `
  <div class="hud"><div class="hud-row">
    <span class="prog">${G.i + 1} / ${G.qs.length}</span>
    <span class="streak ${G.streak >= 3 ? "hot" : ""}" id="streak">${G.streak >= 3 ? "🔥 " : ""}streak ${G.streak}</span>
    <span class="score" id="score">${G.score}</span>
  </div><div class="clockbar"><div class="cfill" id="cfill" style="width:100%"></div></div></div>
  <div class="panel">
    <div class="domchip">${DOMAIN_ICON[q.domain] || "•"} ${esc(sec)} · ${esc(q.domain)}<span class="pace">⏱ SAT pace</span></div>
    ${qBody(q)}
  </div>`;
  document.querySelectorAll(".choice").forEach((b) => b.onclick = () => resolveQ(b.dataset.l));
  clearInterval(G.timer);
  G.timer = setInterval(() => {
    const left = G.deadline - Date.now(), f = $("cfill");
    if (!f) { clearInterval(G.timer); return; }
    f.style.width = Math.max(0, (left / shot) * 100) + "%";
    f.className = "cfill" + (left <= 10000 ? " danger" : left <= 20000 ? " warn" : "");
    if (left <= 0) { clearInterval(G.timer); resolveQ(null); }
  }, 200);
}
function resolveQ(picked) {
  if (G.resolved) return; G.resolved = true; clearInterval(G.timer);
  const q = G.qs[G.i], took = Date.now() - G.t0, shot = SHOT[q.section] || 80000;
  const correct = picked === q.answer;
  const ds = dstat(q.domain); ds.att++;
  ST.seen.push(q.id); if (ST.seen.length > 200) ST.seen = ST.seen.slice(-200);
  const bd = G.byDomain[q.domain] || (G.byDomain[q.domain] = { att: 0, cor: 0 }); bd.att++;
  let pts = 0, bits = [];
  if (correct) {
    ds.cor++; bd.cor++; G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const mult = G.streak >= 5 ? 3 : G.streak >= 3 ? 2 : 1;
    pts = 100 * mult; bits.push(mult > 1 ? `100 × ${mult} streak` : "100");
    if (took < shot * 0.45) { pts += 50; bits.push("+50 speed"); }
    G.score += pts;
  } else {
    G.streak = 0;
    if (q._lesson && !G.missed.includes(q._lesson)) G.missed.push(q._lesson);
  }
  save();
  document.querySelectorAll(".choice").forEach((b) => { b.disabled = true;
    if (b.dataset.l === q.answer) b.classList.add("right"); else if (b.dataset.l === picked) b.classList.add("wrong"); });
  $("score").textContent = G.score;
  $("streak").textContent = (G.streak >= 3 ? "🔥 " : "") + "streak " + G.streak;
  $("streak").className = "streak" + (G.streak >= 3 ? " hot" : "");
  const lessonNote = !correct && q._lesson && LESSONS[q._lesson]
    ? `<div class="learn">📚 Added <b>${esc(LESSONS[q._lesson].title)}</b> to your Study queue.</div>` : "";
  $("verdict").innerHTML = `<div class="verdict ${correct ? "good" : "bad"}">
    ${correct ? `<span class="pts pts-fly">+${pts}</span>` : ""}
    <div class="vh">${correct ? (took < shot * 0.45 ? "Fast and right. ⚡" : "Correct. ✓") : picked ? `Not quite — it's ${q.answer}.` : `Time's up — it's ${q.answer}.`}</div>
    ${bits.length ? `<div class="footnote">${bits.join(" · ")}</div>` : ""}<div>${q.expl}</div>${lessonNote}</div>
    <div class="nextrow"><button class="primary" id="next-btn">${G.i + 1 < G.qs.length ? "Next — shift gears →" : "Finish circuit"}</button></div>`;
  if (correct && G.streak === 5) burst(14);
  $("next-btn").onclick = () => { G.i++; if (G.i < G.qs.length) renderQ(); else endGame(); window.scrollTo(0, 0); };
  $("next-btn").focus();
}
function endGame() {
  VIEW = "end";
  const acc = Math.round((G.correct / G.qs.length) * 100);
  const prevBest = ST.best[G.lenKey] || 0, isPB = G.score > prevBest;
  if (isPB) ST.best[G.lenKey] = G.score;
  ST.sessions.push({ d: Date.now(), n: G.qs.length, h: G.hard, s: G.score, a: acc, k: G.bestStreak, durMs: Date.now() - G.startedAt });
  if (ST.sessions.length > 60) ST.sessions = ST.sessions.slice(-60);
  // optimistic local review add so the queue shows immediately
  for (const lid of G.missed) {
    const cur = ST.localReviews[lid] || { status: "pending", times: 0 };
    ST.localReviews[lid] = { status: "pending", times: (cur.times || 0) + 1 };
  }
  const wasUnderGoal = SERVER.money ? SERVER.money.todayMs < SERVER.money.goalMs : true;
  save();
  syncSession({ ts: Date.now(), len: G.qs.length, hard: G.hard, score: G.score, correct: G.correct,
    bestStreak: G.bestStreak, durMs: Date.now() - G.startedAt, byDomain: G.byDomain, missed: G.missed });
  // local money projection for instant feedback (server reconciles on next state)
  if (SERVER.money) { SERVER.money.todayMs += Date.now() - G.startedAt;
    if (wasUnderGoal && SERVER.money.todayMs >= SERVER.money.goalMs) { SERVER.money.todayEarned = true; SERVER.money.earnedTotal += SERVER.money.rate; paydayCelebrate(); } }
  if (isPB) burst(26);
  const chips = Object.entries(G.byDomain).map(([d, s]) =>
    `<div class="mast"><div class="lbl"><span>${DOMAIN_ICON[d] || "•"} ${esc(d)}</span><span>${s.cor}/${s.att}</span></div>
     <div class="track"><div class="fill" style="width:${(s.cor / s.att) * 100}%"></div></div></div>`).join("");
  const qn = pendingReviews().length;
  $("app").innerHTML = `
  <h1>${acc >= 80 ? "🏁 Strong circuit!" : acc >= 50 ? "🏁 Circuit done" : "🏁 Rough one — reps still count"}</h1>
  <p class="sub">${isPB ? `<span class="pb">🎉 New personal best!</span> (was ${prevBest})` : `Best for this circuit: ${Math.max(prevBest, G.score)}`}</p>
  <div class="stat-row">
    <div class="stat"><div class="num">${G.score}</div><div class="lbl">Score</div></div>
    <div class="stat"><div class="num">${G.correct}/${G.qs.length}</div><div class="lbl">Correct</div></div>
    <div class="stat"><div class="num">${G.bestStreak}</div><div class="lbl">Best streak</div></div>
  </div>
  <div class="panel"><h2>This circuit by domain</h2>${chips}</div>
  ${G.missed.length ? `<div class="panel"><h2>📚 ${G.missed.length} lesson${G.missed.length > 1 ? "s" : ""} added to review</h2>
    ${G.missed.map((lid) => LESSONS[lid] ? `<button class="queue-item" data-lesson="${lid}"><span class="ic">${LESSONS[lid].icon}</span><span class="t"><b>${esc(LESSONS[lid].title)}</b></span><span class="go">›</span></button>` : "").join("")}</div>` : ""}
  <div class="btnrow">
    <button class="primary" id="again">Run it again</button>
    ${qn ? `<button id="study">📚 Study queue (${qn})</button>` : ""}
    <button id="home">Home</button>
  </div>`;
  $("again").onclick = () => startGame(G.qs.length, G.hard);
  $("home").onclick = renderHome;
  if ($("study")) $("study").onclick = renderHome;
  document.querySelectorAll("[data-lesson]").forEach((b) => b.onclick = () => startLesson(b.dataset.lesson));
}

// ---------- lessons ----------
function startLesson(id) {
  const lesson = LESSONS[id]; if (!lesson) return;
  L = { id, lesson, phase: "teach", ci: 0, correct: 0, resolved: false };
  VIEW = "lesson"; renderLesson();
}
function renderLesson() {
  const { lesson } = L;
  if (L.phase === "teach") {
    $("app").innerHTML = `<h1>${lesson.icon} ${esc(lesson.title)}</h1>
      <p class="sub">${esc(lesson.domain)} · guided lesson</p>
      <div class="panel"><h2>The idea</h2><ul class="concept">${lesson.concept.map((c) => `<li>${c}</li>`).join("")}</ul>
        <div class="lesson-ex"><div class="q">${lesson.example.q}</div><div>${lesson.example.work}</div></div></div>
      <div class="panel"><h2>Now try ${lesson.checks.length} to clear this</h2>
        <p class="footnote">Get both right and this lesson leaves your study queue.</p></div>
      <div class="btnrow"><button class="primary" id="begin">Start the check →</button><button id="back">Back</button></div>`;
    $("begin").onclick = () => { L.phase = "check"; L.ci = 0; L.correct = 0; renderLesson(); };
    $("back").onclick = renderHome;
    return;
  }
  if (L.phase === "check") {
    const c = lesson.checks[L.ci]; L.resolved = false;
    $("app").innerHTML = `<h1>${lesson.icon} ${esc(lesson.title)}</h1>
      <p class="sub">Check ${L.ci + 1} of ${lesson.checks.length}</p>
      <div class="panel"><div class="stem">${c.stem}</div>
        <div class="choices">${c.choices.map((ch, i) => `<button class="choice" data-l="${LET[i]}"><span class="cl">${LET[i]}</span><span>${ch}</span></button>`).join("")}</div>
        <div id="verdict"></div></div>`;
    document.querySelectorAll(".choice").forEach((b) => b.onclick = () => resolveCheck(b.dataset.l));
    return;
  }
  // done
  const passed = L.correct === lesson.checks.length;
  if (passed) { ST.localReviews[L.id] = { status: "completed", times: 0 }; save(); syncLesson(L.id); burst(22); }
  $("app").innerHTML = `<h1>${passed ? "✅ Lesson cleared!" : "Almost — give it another pass"}</h1>
    <p class="sub">${lesson.icon} ${esc(lesson.title)} · ${L.correct}/${lesson.checks.length} correct</p>
    <div class="panel"><p>${passed ? "Nice — this one's off your study queue. The skill will keep showing up in circuits so it sticks." : "You need both checks right to clear it. Review the idea and try the checks again — no penalty."}</p></div>
    <div class="btnrow">${passed ? "" : `<button class="primary" id="retry">Review & retry</button>`}
      <button class="${passed ? "primary" : ""}" id="home">Back to home</button></div>`;
  if ($("retry")) $("retry").onclick = () => { L.phase = "teach"; renderLesson(); };
  $("home").onclick = renderHome;
}
function resolveCheck(picked) {
  if (L.resolved) return; L.resolved = true;
  const c = L.lesson.checks[L.ci], correct = picked === c.answer;
  if (correct) L.correct++;
  document.querySelectorAll(".choice").forEach((b) => { b.disabled = true;
    if (b.dataset.l === c.answer) b.classList.add("right"); else if (b.dataset.l === picked) b.classList.add("wrong"); });
  $("verdict").innerHTML = `<div class="verdict ${correct ? "good" : "bad"}"><div class="vh">${correct ? "Correct ✓" : `It's ${c.answer}.`}</div><div>${c.expl}</div></div>
    <div class="nextrow"><button class="primary" id="next">${L.ci + 1 < L.lesson.checks.length ? "Next check →" : "See result"}</button></div>`;
  $("next").onclick = () => { if (L.ci + 1 < L.lesson.checks.length) { L.ci++; renderLesson(); } else { L.phase = "done"; renderLesson(); } window.scrollTo(0, 0); };
  $("next").focus();
}

// ---------- flare ----------
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function paydayCelebrate() { toast("💵 30 minutes — you earned $" + (SERVER.money ? SERVER.money.rate : 5) + " today!"); burst(40); }
function burst(n) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const fx = $("fx"), colors = ["#2B4C9B", "#8A6D1D", "#2E6B46", "#B4690E", "#7C9BE8"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.background = colors[i % colors.length];
    c.style.left = (40 + Math.random() * 20) + "%"; c.style.top = "40%";
    fx.appendChild(c);
    const dx = (Math.random() - 0.5) * 400, dy = -150 - Math.random() * 200, rot = Math.random() * 720;
    c.animate([{ transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 1, offset: .7 },
      { transform: `translate(${dx * 1.3}px, ${dy + 500}px) rotate(${rot}deg)`, opacity: 0 }],
      { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => c.remove();
  }
}
function todayLocalMs() { // local fallback before server responds
  const today = new Date().toDateString();
  return ST.sessions.filter((s) => new Date(s.d).toDateString() === today).reduce((a, s) => a + (s.durMs || 0), 0);
}

// ---------- boot ----------
(async function boot() {
  renderHome();          // instant paint from baked pool + local state
  await Promise.all([fetchPool(), fetchState()]);
  if (VIEW === "home") renderHome();  // repaint with server data if still on home
  flushPending();
})();
</script>
