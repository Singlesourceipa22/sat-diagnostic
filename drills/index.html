<!doctype html><html lang="en"><head><meta charset="utf-8">

</head><body><title>Gear Shift — SAT Drills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --paper: #F7F8FA; --surface: #FFFFFF; --ink: #1C1F26; --muted: #5A6170;
    --line: #D8DCE3; --line-soft: #E7EAEF;
    --accent: #2B4C9B; --accent-ink: #FFFFFF; --accent-soft: #E9EEF9;
    --warn: #B4690E; --danger: #B3261E; --danger-soft: #F9ECEB;
    --ok: #2E6B46; --ok-soft: #E8F2EC; --gold: #8A6D1D; --gold-soft: #F6EFD8;
    --shadow: 0 1px 3px rgba(28,31,38,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14161B; --surface: #1C1F26; --ink: #E8EAEF; --muted: #9AA1AE;
      --line: #363B47; --line-soft: #2A2E38;
      --accent: #7C9BE8; --accent-ink: #10131A; --accent-soft: #232B3E;
      --warn: #E0A458; --danger: #E8837B; --danger-soft: #3A2523;
      --ok: #7FBF9A; --ok-soft: #1F3128; --gold: #D9BC6A; --gold-soft: #33301F;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14161B; --surface: #1C1F26; --ink: #E8EAEF; --muted: #9AA1AE;
    --line: #363B47; --line-soft: #2A2E38;
    --accent: #7C9BE8; --accent-ink: #10131A; --accent-soft: #232B3E;
    --warn: #E0A458; --danger: #E8837B; --danger-soft: #3A2523;
    --ok: #7FBF9A; --ok-soft: #1F3128; --gold: #D9BC6A; --gold-soft: #33301F;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); margin: 0;
    font-family: 'IBM Plex Serif', Georgia, serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 90px; }
  h1 { font-family: 'IBM Plex Sans', sans-serif; font-size: 25px; margin: 6px 0 2px; }
  .sub { color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; margin: 0 0 16px; }
  .footnote { color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; margin: 14px 0; box-shadow: var(--shadow); }
  .panel h2 { font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  button { font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600;
    border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
    color: var(--ink); padding: 11px 16px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .lenrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .lenrow button { flex: 1 1 96px; padding: 14px 8px; text-align: center; }
  .lenrow button b { display: block; font-size: 22px; }
  .lenrow button span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .toggle { display: flex; align-items: center; gap: 10px; margin: 14px 0 2px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--warn); }

  /* payday bar */
  .payday { background: linear-gradient(0deg, var(--gold-soft), var(--surface)); }
  .money-track { height: 12px; background: var(--line-soft); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
  .money-fill { height: 100%; background: var(--gold); border-radius: 99px; transition: width .5s ease; }
  .money-fill.done { background: var(--ok); }
  .money-line { font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; display: flex; justify-content: space-between; }

  /* mastery / lists */
  .mast { margin: 7px 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; }
  .mast .lbl { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 2px; }
  .mast .track { height: 7px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
  .mast .fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .queue-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1.5px solid var(--line);
    border-radius: 12px; margin: 8px 0; background: var(--paper); width: 100%; text-align: left; }
  .queue-item .ic { font-size: 22px; flex: none; }
  .queue-item .t { flex: 1; font-family: 'IBM Plex Sans', sans-serif; }
  .queue-item .t b { font-size: 14.5px; } .queue-item .t small { color: var(--muted); font-size: 12px; }
  .queue-item .go { color: var(--accent); font-weight: 700; font-size: 20px; }
  .badge { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 99px; background: var(--danger-soft); color: var(--danger); }

  /* how-it-works */
  .hiw { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
  .hiw .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }

  /* HUD */
  .hud { position: sticky; top: 0; z-index: 10; background: var(--surface);
    border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
    margin: -18px -16px 14px; padding: 10px 16px 0; }
  .hud-row { max-width: 608px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; padding-bottom: 8px; }
  .hud .prog { color: var(--muted); font-weight: 600; }
  .hud .score { font-family: 'IBM Plex Mono', monospace; font-weight: 600; margin-left: auto; font-size: 16px; }
  .streak { font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--line-soft); color: var(--muted); font-size: 13px; }
  .streak.hot { background: var(--gold-soft); color: var(--gold); }
  .clockbar { height: 5px; background: var(--line-soft); margin: 0 -16px; }
  .clockbar .cfill { height: 100%; background: var(--accent); transition: width .25s linear; }
  .clockbar .cfill.warn { background: var(--warn); } .clockbar .cfill.danger { background: var(--danger); }

  .domchip { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px; }
  .domchip .pace { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .passage { margin: 0 0 10px; } .passage p { margin: 0 0 8px; }
  .fig { margin: 10px 0 4px; }
  .fig svg { display: block; margin: 0 auto; max-width: 240px; height: auto; color: var(--ink); }
  ul.notes { margin: 6px 0 10px 4px; padding-left: 20px; } ul.notes li { margin: 4px 0; }
  .qtable-wrap { overflow-x: auto; margin: 10px 0; }
  .qtable { border-collapse: collapse; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
  .qtable th, .qtable td { border: 1px solid var(--line); padding: 5px 11px; text-align: left; }
  .qtable th { background: var(--line-soft); }
  .stem { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; margin: 10px 0; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice { display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%;
    font-family: 'IBM Plex Serif', Georgia, serif; font-size: 16px; line-height: 1.45;
    padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--paper); color: var(--ink); }
  .choice .cl { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); flex: none; width: 18px; }
  .choice.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
  .choice.wrong { border-color: var(--danger); background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger); }
  .choice[disabled] { cursor: default; }
  .verdict { font-family: 'IBM Plex Sans', sans-serif; border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 14px; }
  .verdict.good { background: var(--ok-soft); border: 1px solid var(--ok); }
  .verdict.bad { background: var(--danger-soft); border: 1px solid var(--danger); }
  .verdict .vh { font-weight: 700; margin-bottom: 3px; } .verdict .pts { float: right; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .verdict .learn { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .nextrow { display: flex; justify-content: flex-end; margin-top: 12px; gap: 8px; }

  /* lesson view */
  .lesson-ex { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
  .lesson-ex .q { font-style: italic; margin-bottom: 6px; }
  .concept { font-family: 'IBM Plex Sans', sans-serif; font-size: 14.5px; padding-left: 20px; margin: 8px 0; }
  .concept li { margin: 7px 0; }

  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .stat { flex: 1 1 100px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-family: 'IBM Plex Sans', sans-serif; }
  .stat .num { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; } .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .pb { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; color: var(--gold); }

  /* confetti + toast */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetti { position: absolute; width: 9px; height: 9px; border-radius: 2px; will-change: transform, opacity; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 60;
    background: var(--ink); color: var(--paper); font-family: 'IBM Plex Sans', sans-serif; font-weight: 600;
    font-size: 15px; padding: 12px 20px; border-radius: 99px; box-shadow: 0 4px 20px rgba(0,0,0,.3);
    opacity: 0; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  @media (max-width: 480px) { body { font-size: 16px; } .panel { padding: 15px 16px; } .wrap { padding: 14px 12px 84px; } }
  @media (prefers-reduced-motion: no-preference) {
    .choice, button { transition: border-color .12s, background .12s; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pts-fly { animation: pop .3s ease; }
  }
</style>

<script>
const BAKED = [{"id":"drill01:RW1","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (contrast clue)","diff":"E","_lesson":"vocab-in-context","passage":"Although the film's plot was praised as inventive, its dialogue struck many critics as ______, echoing lines from dozens of earlier movies.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["original","derivative","incoherent","witty"],"answer":"B","expl":"“Although” flips the direction: plot inventive, dialogue the opposite — derivative (copied). “Echoing lines from earlier movies” is the definition."},{"id":"drill01:RW2","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (colon = definition)","diff":"M","_lesson":"vocab-in-context","passage":"The results of the lab's replication effort were remarkably ______: every one of the forty trials produced the same measurement.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["ambiguous","inconclusive","consistent","controversial"],"answer":"C","expl":"The colon introduces the definition of the blank. Forty identical outcomes = consistent."},{"id":"drill01:RW3","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (contrast clue)","diff":"M","_lesson":"vocab-in-context","passage":"The committee's first proposal was widely criticized as extravagant; its revised plan, however, won praise for being ______.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["elaborate","ambitious","impractical","economical"],"answer":"D","expl":"“However” demands the opposite of extravagant → economical. Always find the pivot word before reading choices."},{"id":"drill01:RW4","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (precision among near-synonyms)","diff":"H","_lesson":"vocab-in-context","passage":"The biography is admiring but not ______: the author celebrates her subject's achievements while cataloguing his failures with equal care.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["uncritical","detailed","engaging","concise"],"answer":"A","expl":"“Admiring but not X” + “catalogues failures too” → admiring without being blind to flaws: uncritical. The colon explains the blank."},{"id":"drill01:RW5","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (vocabulary)","diff":"E","_lesson":"vocab-in-context","passage":"Wetlands play a ______ role in flood control, absorbing storm water that would otherwise inundate nearby towns.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["negligible","mysterious","crucial","disputed"],"answer":"C","expl":"The sentence itself praises what wetlands do — the blank must be positive and strong: crucial."},{"id":"drill01:RW6","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Text structure and purpose","diff":"M","_lesson":"text-purpose","passage":"For decades, textbooks described the brain as fixed after childhood. Imaging studies of London taxi drivers, however, showed measurable growth in memory-related regions after years of navigating the city.","stem":"Which choice best describes the function of the second sentence?","choices":["It offers evidence that complicates the view described in the first sentence.","It provides an example supporting the textbook description.","It explains why textbooks avoided the topic of brain development.","It summarizes the history of brain imaging."],"answer":"A","expl":"“However” + contradicting data = evidence against the old view. Ask what a sentence DOES, not what it says."},{"id":"drill01:RW7","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (contrast clue)","diff":"M","_lesson":"vocab-in-context","passage":"Far from being ______, the desert teems with life exquisitely adapted to scarce water.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["vast","barren","arid","remote"],"answer":"B","expl":"“Far from being X, it teems with life” → X must mean lifeless: barren. “Arid” (dry) is the trap — the desert IS arid; the contrast is about life, not dryness."},{"id":"drill01:RW8","bankId":"drill01","section":"RW","domain":"Craft and Structure","skill":"Words in context (colon = definition)","diff":"M","_lesson":"vocab-in-context","passage":"Cephalopod camouflage is a ______ process: an octopus adjusts its color continuously as it moves across changing backgrounds.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["static","dynamic","simple","hidden"],"answer":"B","expl":"Colon defines the blank: “adjusts continuously” = dynamic (always changing)."},{"id":"drill01:RW9","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Subject–verb agreement (interrupting phrase)","diff":"E","_lesson":"subject-verb","passage":"The bouquet of roses and lilies ______ on the hall table all week.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["were","have been","was","are"],"answer":"C","expl":"Strip the interrupter: “The bouquet ... was.” The subject is bouquet (singular), not roses and lilies."},{"id":"drill01:RW10","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Subject–verb agreement (each/every)","diff":"M","_lesson":"subject-verb","passage":"Each of the students, including the graduating seniors, ______ required to register by Friday.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","are","were","have been"],"answer":"A","expl":"“Each” is always singular, no matter what plural nouns crowd in after it: each ... is."},{"id":"drill01:RW11","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Dangling modifiers","diff":"M","_lesson":"modifiers","passage":"Running to catch the bus, ______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Maya's phone slipped out of her pocket.","the phone slipped out of Maya's pocket.","Maya dropped her phone.","it was Maya's phone that dropped."],"answer":"C","expl":"Whoever is running must come right after the comma. Maya was running — so “Maya” must be the subject, not her phone."},{"id":"drill01:RW12","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Dangling modifiers","diff":"H","_lesson":"modifiers","passage":"To qualify for the scholarship, ______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["two recommendation letters are required from applicants.","applicants must submit two recommendation letters.","the application must include two recommendation letters.","there is a requirement of two recommendation letters."],"answer":"B","expl":"Who qualifies? Applicants — so “applicants” must follow the comma. Letters and applications don't qualify for scholarships."},{"id":"drill01:RW13","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Punctuating nonrestrictive appositives","diff":"M","_lesson":"punctuation","passage":"My neighbor's dog, a ten-year-old golden ______ greets everyone who passes the fence.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["retriever,","retriever;","retriever —","retriever"],"answer":"A","expl":"An appositive that opens with a comma must close with a comma — the pair works like parentheses."},{"id":"drill01:RW14","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Sentence boundaries (joining independent clauses)","diff":"M","_lesson":"punctuation","passage":"The tide was rising fast ______ the crew hurried to load the last crates.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["fast;","fast,","fast","fast, however,"],"answer":"A","expl":"Two complete sentences need a semicolon (or comma + conjunction). A bare comma is a splice; nothing at all is a run-on."},{"id":"drill01:RW15","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Verb tense (past perfect)","diff":"E","_lesson":"verb-tense","passage":"By the time the pizza finally arrived, we ______ the entire salad.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["finish","have finished","had finished","will have finished"],"answer":"C","expl":"“By the time X happened” = something was already done before a past event → past perfect: had finished."},{"id":"drill01:RW16","bankId":"drill01","section":"RW","domain":"Standard English Conventions","skill":"Relative pronouns","diff":"H","_lesson":"punctuation","passage":"The museum agreed to return the artifacts to the villages from ______ they had been taken a century earlier.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["which","where","whom","that"],"answer":"A","expl":"After a preposition, use “which” for things/places: “from which.” (“Where” can't follow “from”; “whom” is for people.)"},{"id":"drill01:RW17","bankId":"drill01","section":"RW","domain":"Expression of Ideas","skill":"Transitions (contrast)","diff":"M","_lesson":"transitions","passage":"Solar panels have dropped in price dramatically over the past decade. ______ installation labor costs have stayed stubbornly high.","stem":"Which choice completes the text with the most logical transition?","choices":["Therefore,","However,","For example,","Similarly,"],"answer":"B","expl":"Prices falling vs. costs staying high = opposition → However. Name the relationship between sentences before picking."},{"id":"drill01:RW18","bankId":"drill01","section":"RW","domain":"Expression of Ideas","skill":"Transitions (concession)","diff":"M","_lesson":"transitions","passage":"The recipe is undeniably time-consuming, demanding three separate rises of the dough. ______ most bakers who attempt it say the result justifies every minute.","stem":"Which choice completes the text with the most logical transition?","choices":["In addition,","As a result,","Even so,","Specifically,"],"answer":"C","expl":"Acknowledge the downside, then push past it: that's concession — Even so / Nevertheless."},{"id":"drill01:RW19","bankId":"drill01","section":"RW","domain":"Expression of Ideas","skill":"Transitions (cause and effect)","diff":"E","_lesson":"transitions","passage":"Inspectors rated the bridge structurally deficient last spring. ______ the county closed it to truck traffic.","stem":"Which choice completes the text with the most logical transition?","choices":["As a result,","In contrast,","For instance,","Meanwhile,"],"answer":"A","expl":"Bad rating → closure is cause and effect: As a result."},{"id":"drill01:RW20","bankId":"drill01","section":"RW","domain":"Expression of Ideas","skill":"Rhetorical synthesis (matching a stated goal)","diff":"M","_lesson":"rhetorical-synthesis","notes":["The Harborview Library opened in 1912.","A 2020 renovation added a maker space with 3D printers and recording booths.","Since the renovation, circulation and visits have risen 30 percent.","The library's clock tower is a local landmark."],"stem":"The student wants to emphasize the effect of the renovation. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Harborview Library, opened in 1912, has a clock tower that is a local landmark.","Since its 2020 renovation added a maker space, the library's circulation and visits have risen 30 percent.","The Harborview Library was renovated in 2020.","Libraries increasingly feature maker spaces with 3D printers."],"answer":"B","expl":"The goal is the EFFECT of the renovation — so the sentence must connect renovation → the 30% rise. Match the goal, not the most interesting fact."},{"id":"drill01:RW21","bankId":"drill01","section":"RW","domain":"Expression of Ideas","skill":"Transitions (drawing a conclusion)","diff":"H","_lesson":"transitions","passage":"None of the twelve replication attempts reproduced the original finding. ______ the research team formally withdrew its earlier claim.","stem":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","By contrast,","Accordingly,","Meanwhile,"],"answer":"C","expl":"Evidence → the action it justifies: Accordingly (= therefore). “Nevertheless” would mean they withdrew DESPITE the failures."},{"id":"drill01:RW22","bankId":"drill01","section":"RW","domain":"Information and Ideas","skill":"Inference (logical completion)","diff":"M","_lesson":"inference","passage":"Streetlights that spill into forest edges disrupt the nightly rhythms of moths and beetles. Some cities have begun dimming streetlights after midnight, when traffic is light. Because insect activity peaks in those same late hours, researchers expect that the dimming programs ______","stem":"Which choice most logically completes the text?","choices":["will have little effect on insects while inconveniencing drivers.","may reduce harm to insects without much affecting drivers.","should be replaced by brighter lighting throughout the night.","will increase traffic during late-night hours."],"answer":"B","expl":"Combine the clues: dimming happens when insects are active (helps them) and traffic is light (doesn't hurt drivers). The completion must use both."},{"id":"drill01:RW23","bankId":"drill01","section":"RW","domain":"Information and Ideas","skill":"Command of evidence (textual)","diff":"M","_lesson":"command-of-evidence","passage":"A city councilmember claims that community gardens reduce participating households' grocery spending.","stem":"Which finding, if true, would most directly support the claim?","choices":["Households with garden plots report higher satisfaction with their neighborhood.","Produce spending by households with plots averaged 15 percent less than that of similar households without plots.","Community gardens increase nearby property values.","Most garden plots are tended on weekends."],"answer":"B","expl":"The claim is about grocery SPENDING — only the spending comparison touches it. Nice-sounding benefits that don't address the claim are decoys."},{"id":"drill01:RW24","bankId":"drill01","section":"RW","domain":"Information and Ideas","skill":"Central ideas (main idea)","diff":"E","_lesson":"central-ideas","passage":"Coral bleaching occurs when heat-stressed corals expel the algae living in their tissues. Because those algae supply most of the coral's food through photosynthesis, a bleached coral is not dead but is starving, and it can recover if water temperatures fall soon enough.","stem":"Which choice best states the main idea of the text?","choices":["Bleached corals are permanently dead.","Algae harm corals by consuming their food.","Bleaching starves corals but is survivable if temperatures drop in time.","Water temperature has little effect on coral health."],"answer":"C","expl":"Main idea = the whole text in one line: expelled algae → starvation → recoverable. Wrong answers each contradict a stated detail."},{"id":"drill01:RW25","bankId":"drill01","section":"RW","domain":"Information and Ideas","skill":"Inference (synthesizing multiple clues)","diff":"H","_lesson":"inference","passage":"Archaeologists studying the island village found fish-drying racks with far more capacity than its small population could have used. Ledgers kept by mainland merchants from the same period list salted island fish among their most frequent purchases. Taken together, these findings suggest that the village ______","stem":"Which choice most logically completes the text?","choices":["struggled to catch enough fish to feed itself.","produced dried fish primarily for trade with the mainland.","had a larger population than archaeologists estimated.","abandoned fishing in favor of farming."],"answer":"B","expl":"Two clues must BOTH be used: excess capacity + mainland purchase records = production for trade. An answer that explains only one clue loses."},{"id":"drill01:RW26","bankId":"drill01","section":"RW","domain":"Information and Ideas","skill":"Command of evidence (quantitative)","diff":"M","_lesson":"command-of-evidence","passage":"A journalist claims that the share of employees working fully remote has plateaued since 2023.","stem":"Which finding, if true, would most directly support the claim?","choices":["Surveys show the fully remote share held between 13 and 15 percent every quarter from 2023 through 2026.","The number of coworking spaces doubled between 2023 and 2026.","Most workers say they would prefer a hybrid schedule.","Remote job postings rose sharply in 2021."],"answer":"A","expl":"“Plateaued” = a flat trend over the period — only the steady 13–15 percent series shows that. Check that the evidence matches the claim's time window AND direction."},{"id":"drill01:M1","bankId":"drill01","section":"M","domain":"Algebra","skill":"Interpreting linear models","diff":"E","_lesson":"linear-models","passage":"The height of a tomato plant is modeled by P = 12 + 3w, where P is height in centimeters w weeks after planting.","stem":"What is the best interpretation of the number 3 in this context?","choices":["The plant was 3 cm tall when planted.","The plant grows about 3 cm per week.","The plant is measured every 3 weeks.","The plant stops growing after 3 weeks."],"answer":"B","expl":"The coefficient on the variable is always the rate: 3 cm per week. The constant (12) is the starting value."},{"id":"drill01:M2","bankId":"drill01","section":"M","domain":"Algebra","skill":"Interpreting linear models","diff":"M","_lesson":"linear-models","passage":"An electrician charges C = 40 + 55h dollars for a job lasting h hours.","stem":"What is the best interpretation of the number 40 in this context?","choices":["The hourly labor rate is $40.","The minimum job length is 40 minutes.","There is a fixed charge of $40 regardless of job length.","The electrician works at most 40 hours."],"answer":"C","expl":"The constant term is what you pay at h = 0: a fixed fee. The 55 is the hourly rate."},{"id":"drill01:M3","bankId":"drill01","section":"M","domain":"Algebra","skill":"Linear functions from two points","diff":"M","_lesson":"slope-two-points","passage":"A line passes through the points (1, 4) and (3, 10).","stem":"Which equation defines the line?","choices":["y = 3x + 1","y = 3x − 1","y = 6x − 2","y = 2x + 2"],"answer":"A","expl":"Slope = (10−4)/(3−1) = 3; through (1,4) → y = 3x + 1. Check BOTH points — traps like y = 6x − 2 pass through only the first."},{"id":"drill01:M4","bankId":"drill01","section":"M","domain":"Algebra","skill":"Slope from two points","diff":"M","_lesson":"slope-two-points","passage":"A line passes through (−2, 7) and (4, −5).","stem":"What is the slope of the line?","choices":["−2","2","−1/2","−12"],"answer":"A","expl":"(−5 − 7)/(4 − (−2)) = −12/6 = −2. Keep the subtraction order identical on top and bottom, and mind the double negative."},{"id":"drill01:M5","bankId":"drill01","section":"M","domain":"Algebra","skill":"Systems of linear equations","diff":"M","_lesson":"systems","passage":"x + 2y = 11 and 3x − 2y = 1","stem":"If (x, y) is the solution to the system, what is the value of x + y?","choices":["3","4","7","12"],"answer":"C","expl":"Add the equations: 4x = 12 → x = 3, then y = 4, so x + y = 7. Read what's asked — x alone (3) is a planted trap."},{"id":"drill01:M6","bankId":"drill01","section":"M","domain":"Algebra","skill":"Linear inequalities from context","diff":"H","_lesson":"inequalities","passage":"A delivery van can carry at most 900 pounds. The driver weighs 180 pounds, and each box weighs 35 pounds.","stem":"What is the greatest number of boxes the van can carry?","choices":["20","21","25","26"],"answer":"A","expl":"35b + 180 ≤ 900 → b ≤ 20.57 → 20 boxes. Round DOWN for “at most,” and don't forget the driver (900/35 = 25.7 is the trap)."},{"id":"drill01:M7","bankId":"drill01","section":"M","domain":"Advanced Math","skill":"Exponent rules","diff":"M","_lesson":"exponent-rules","passage":"x⁶ · x² / x³, where x > 0","stem":"The expression is equivalent to which of the following?","choices":["x⁵","x⁴","x¹²","x³⁶"],"answer":"A","expl":"Multiply → add exponents (6+2=8); divide → subtract (8−3=5). Never multiply the exponents for a product."},{"id":"drill01:M8","bankId":"drill01","section":"M","domain":"Advanced Math","skill":"Exponent rules (power of a product)","diff":"H","_lesson":"exponent-rules","passage":"(2x³)⁴","stem":"The expression is equivalent to which of the following?","choices":["8x⁷","16x⁷","8x¹²","16x¹²"],"answer":"D","expl":"The 4th power hits BOTH factors: 2⁴ = 16 and (x³)⁴ = x¹². Power of a power multiplies exponents."},{"id":"drill01:M9","bankId":"drill01","section":"M","domain":"Advanced Math","skill":"Exponential growth models","diff":"M","_lesson":"exponential-models","passage":"An investment worth $200 triples in value every 5 years.","stem":"Which equation models its value V after t years?","choices":["V = 200 · 3^(t/5)","V = 200 · 3^(5t)","V = 200 + 3^(t/5)","V = 3 · 200^(t/5)"],"answer":"A","expl":"The exponent counts the number of triplings: t/5. “Grows by factor k every p years” → base k, exponent t/p, starting value out front."},{"id":"drill01:M10","bankId":"drill01","section":"M","domain":"Advanced Math","skill":"Exponential growth (doubling)","diff":"H","_lesson":"exponential-models","passage":"A bacteria population doubles every 10 hours.","stem":"After 30 hours, the population will be how many times its starting size?","choices":["3 times","6 times","8 times","2 times"],"answer":"C","expl":"Three doublings: 2 × 2 × 2 = 2³ = 8. The trap (6) treats doubling as adding — exponential growth multiplies."},{"id":"drill01:M11","bankId":"drill01","section":"M","domain":"Advanced Math","skill":"Quadratic vertex (vertex form)","diff":"M","_lesson":"quadratic-vertex","passage":"y = (x − 3)² + 4","stem":"What is the vertex of the parabola?","choices":["(3, 4)","(−3, 4)","(3, −4)","(4, 3)"],"answer":"A","expl":"Vertex form y = (x − h)² + k puts the vertex at (h, k) — the sign inside flips: (x − 3) means h = +3."},{"id":"drill01:M12","bankId":"drill01","section":"M","domain":"Advanced Math","skill":"Quadratic maximum (vertex)","diff":"H","_lesson":"quadratic-vertex","passage":"A rocket's height is h = −16t² + 96t feet after t seconds.","stem":"What is the rocket's maximum height, in feet?","choices":["96","48","288","144"],"answer":"D","expl":"Peak at t = −b/2a = 96/32 = 3; h(3) = −144 + 288 = 144. Find the vertex time first, then plug it back in."},{"id":"drill01:M13","bankId":"drill01","section":"M","domain":"Geometry and Trigonometry","skill":"Triangle angle sum","diff":"E","_lesson":"triangle-basics","passage":"Two angles of a triangle measure 42° and 71°.","fig":"\u003csvg viewBox=\"0 0 220 160\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M20 140 L200 140 L157 16 Z\"/>\u003ctext x=\"40\" y=\"133\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">42°\u003c/text>\u003ctext x=\"163\" y=\"133\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\" text-anchor=\"end\">71°\u003c/text>\u003ctext x=\"152\" y=\"42\" fill=\"currentColor\" stroke=\"none\" font-size=\"14\">?\u003c/text>\u003c/svg>","stem":"What is the measure of the third angle?","choices":["57°","67°","77°","113°"],"answer":"B","expl":"Angles of a triangle always total 180°: 180 − 42 − 71 = 67."},{"id":"drill01:M14","bankId":"drill01","section":"M","domain":"Geometry and Trigonometry","skill":"Circles (area → circumference)","diff":"M","_lesson":"circles","passage":"A circle has an area of 36π square units.","fig":"\u003csvg viewBox=\"0 0 220 160\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"110\" cy=\"82\" r=\"62\"/>\u003ccircle cx=\"110\" cy=\"82\" r=\"2.5\" fill=\"currentColor\" stroke=\"none\"/>\u003cline x1=\"110\" y1=\"82\" x2=\"172\" y2=\"82\"/>\u003ctext x=\"138\" y=\"74\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">r\u003c/text>\u003c/svg>","stem":"What is its circumference?","choices":["6π","12π","36π","72π"],"answer":"B","expl":"A = πr² = 36π → r = 6 → C = 2πr = 12π. Area finds r; r finds everything else."},{"id":"drill01:M15","bankId":"drill01","section":"M","domain":"Geometry and Trigonometry","skill":"Circles (circumference → area)","diff":"M","_lesson":"circles","passage":"A circle has a circumference of 10π units.","fig":"\u003csvg viewBox=\"0 0 220 160\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"110\" cy=\"82\" r=\"62\"/>\u003ccircle cx=\"110\" cy=\"82\" r=\"2.5\" fill=\"currentColor\" stroke=\"none\"/>\u003cline x1=\"110\" y1=\"82\" x2=\"172\" y2=\"82\"/>\u003ctext x=\"138\" y=\"74\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">r\u003c/text>\u003c/svg>","stem":"What is its area?","choices":["10π","5π","25π","100π"],"answer":"C","expl":"C = 2πr = 10π → r = 5 → A = πr² = 25π. Same move in reverse: always go through r."},{"id":"drill01:M16","bankId":"drill01","section":"M","domain":"Geometry and Trigonometry","skill":"Pythagorean theorem","diff":"M","_lesson":"pythagorean","passage":"A right triangle has a hypotenuse of 17 and one leg of length 8.","fig":"\u003csvg viewBox=\"0 0 220 160\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M30 130 L30 50 L180 130 Z\"/>\u003cpath d=\"M30 118 L42 118 L42 130\" stroke-width=\"1\"/>\u003ctext x=\"20\" y=\"94\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">8\u003c/text>\u003ctext x=\"110\" y=\"80\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">17\u003c/text>\u003ctext x=\"105\" y=\"148\" fill=\"currentColor\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">?\u003c/text>\u003c/svg>","stem":"What is the length of the other leg?","choices":["15","9","25","√353"],"answer":"A","expl":"Finding a LEG means subtract: √(17² − 8²) = √225 = 15. √353 comes from adding — only add when finding the hypotenuse."},{"id":"drill01:M17","bankId":"drill01","section":"M","domain":"Geometry and Trigonometry","skill":"Right-triangle trig (SOH-CAH-TOA)","diff":"H","_lesson":"right-triangle-trig","passage":"In a right triangle, tan A = 3/4.","fig":"\u003csvg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M25 145 L185 145 L185 25 Z\"/>\u003cpath d=\"M173 145 L173 133 L185 133\" stroke-width=\"1\"/>\u003cpath d=\"M55 145 A30 30 0 0 0 51 125\" stroke-width=\"1\"/>\u003ctext x=\"14\" y=\"150\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">A\u003c/text>\u003ctext x=\"105\" y=\"161\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">4\u003c/text>\u003ctext x=\"193\" y=\"90\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">3\u003c/text>\u003c/svg>","stem":"What is sin A?","choices":["3/4","4/5","3/5","4/3"],"answer":"C","expl":"tan = 3/4 means legs 3 and 4 → hypotenuse 5 (3-4-5 triangle). sin = opposite/hypotenuse = 3/5."},{"id":"drill01:M18","bankId":"drill01","section":"M","domain":"Geometry and Trigonometry","skill":"Complementary angles (sin ↔ cos)","diff":"M","_lesson":"right-triangle-trig","passage":"sin 35° = cos x°, where 0 \u003c x \u003c 90.","stem":"What is the value of x?","choices":["35","45","55","65"],"answer":"C","expl":"sine of an angle = cosine of its complement: x = 90 − 35 = 55. This identity shows up constantly — memorize it."},{"id":"drill01:M19","bankId":"drill01","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Reverse percent change","diff":"M","_lesson":"percent","passage":"After a 25% discount, a jacket costs $45.","stem":"What was the original price?","choices":["$56.25","$60","$33.75","$70"],"answer":"B","expl":"Sale price = 75% of original → 45 / 0.75 = 60. To undo a percent change, DIVIDE — adding 25% back ($56.25) is the classic trap."},{"id":"drill01:M20","bankId":"drill01","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Reverse percent change (tax)","diff":"H","_lesson":"percent","passage":"With 8% sales tax included, a laptop's total price is $270.","stem":"What was the price before tax?","choices":["$248.40","$291.60","$250","$262"],"answer":"C","expl":"Total = 1.08 × price → 270 / 1.08 = 250. Taking 8% OFF the total ($248.40) is the trap — percent up and percent down aren't symmetric."},{"id":"drill01:M21","bankId":"drill01","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Two-way tables and probability","diff":"M","_lesson":"two-way-tables","passage":"A survey of 120 students asked whether they play a sport.","table":{"headers":["","Plays a sport","Does not","Total"],"rows":[["10th grade","28","22","50"],["11th grade","40","30","70"],["Total","68","52","120"]]},"stem":"If a surveyed student is chosen at random, what is the probability the student is an 11th grader who plays a sport?","choices":["1/3","4/7","7/12","10/17"],"answer":"A","expl":"“Is an 11th grader AND plays” → 40 out of ALL 120 = 1/3. 4/7 answers a different question (plays, GIVEN 11th grade) — the denominator is everything."},{"id":"drill01:M22","bankId":"drill01","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Mean","diff":"E","_lesson":"stats-center","passage":"Data set: 4, 6, 9, 13","stem":"What is the mean of the data set?","choices":["7.5","8","8.5","9"],"answer":"B","expl":"(4+6+9+13)/4 = 32/4 = 8. (7.5 is the median — know which is which.)"}];          // offline fallback pool (baked at build)
