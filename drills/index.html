eree's decision.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","is","were","has been"],"answer":"C","expl":"With neither/nor, the verb agrees with the NEARER subject — “players” (plural) → were."},{"id":"drill03:RW18","bankId":"drill03","section":"RW","domain":"Standard English Conventions","skill":"Dangling modifiers","diff":"M","_lesson":"modifiers","passage":"Exhausted after the double shift, ______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the train lulled the nurse to sleep.","sleep came quickly to the nurse.","the nurse fell asleep on the train.","the nurse's eyes closed on the train."],"answer":"C","expl":"Who was exhausted? The nurse — so “the nurse” must follow the comma. Trains, sleep, and eyes weren't working a double shift."},{"id":"drill03:RW19","bankId":"drill03","section":"RW","domain":"Standard English Conventions","skill":"Punctuating nonrestrictive appositives","diff":"M","_lesson":"punctuation","passage":"The novel's narrator, an unreliable ______ hides key facts until the final chapter.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["storyteller;","storyteller —","storyteller,","storyteller"],"answer":"C","expl":"The appositive opened with a comma after “narrator,” so it must close with a comma."},{"id":"drill03:RW20","bankId":"drill03","section":"RW","domain":"Standard English Conventions","skill":"Sentence boundaries (joining independent clauses)","diff":"H","_lesson":"punctuation","passage":"Solar storms can disrupt satellites ______ engineers therefore build extra shielding into every unit.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["satellites,","satellites","satellites and","satellites;"],"answer":"D","expl":"Two complete sentences; “therefore” is not a conjunction, so a comma alone splices. The semicolon is correct."},{"id":"drill03:RW21","bankId":"drill03","section":"RW","domain":"Standard English Conventions","skill":"Verb tense (future perfect)","diff":"E","_lesson":"verb-tense","passage":"By next June, the crew ______ the tunnel for two full years.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["has dug","will have been digging","is digging","dug"],"answer":"B","expl":"“By next June … for two years” = an action continuing up to a future point → future perfect progressive."},{"id":"drill03:RW22","bankId":"drill03","section":"RW","domain":"Expression of Ideas","skill":"Transitions (contrast)","diff":"M","_lesson":"transitions","passage":"The museum extended its hours to draw more visitors. ______ attendance actually dipped the following month.","stem":"Which choice completes the text with the most logical transition?","choices":["Therefore,","For example,","In addition,","However,"],"answer":"D","expl":"The result contradicts the intent → However. “Actually” is the tell."},{"id":"drill03:RW23","bankId":"drill03","section":"RW","domain":"Expression of Ideas","skill":"Transitions (cause and effect)","diff":"E","_lesson":"transitions","passage":"Reef fish depend on coral for shelter. ______ when coral dies, fish populations fall as well.","stem":"Which choice completes the text with the most logical transition?","choices":["In contrast,","As a result,","Similarly,","For instance,"],"answer":"B","expl":"Dependence → consequence when the coral dies: cause and effect."},{"id":"drill03:RW24","bankId":"drill03","section":"RW","domain":"Expression of Ideas","skill":"Rhetorical synthesis (matching a stated goal)","diff":"M","_lesson":"rhetorical-synthesis","notes":["The Great Lakes hold about 21 percent of the world's surface fresh water.","Lake Superior is the largest of the lakes by surface area.","Lake levels rose about a foot between 2013 and 2020.","Shipping on the lakes moves about 160 million tons of cargo each year."],"stem":"The student wants to emphasize the lakes' economic importance. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Great Lakes hold about 21 percent of the world's surface fresh water.","Lake Superior is the largest of the Great Lakes by surface area.","Lake levels rose about a foot between 2013 and 2020.","Shipping on the Great Lakes moves about 160 million tons of cargo each year."],"answer":"D","expl":"Economic importance → the cargo figure. The others are geography, not economy."},{"id":"drill03:M1","bankId":"drill03","section":"M","domain":"Algebra","skill":"Linear equations (distribution)","diff":"E","_lesson":"linear-equations","passage":"2(x + 5) = 18","stem":"What is the value of x?","choices":["9","4","6.5","13"],"answer":"B","expl":"2x + 10 = 18 → 2x = 8 → x = 4."},{"id":"drill03:M2","bankId":"drill03","section":"M","domain":"Algebra","skill":"Linear equations (fractions)","diff":"M","_lesson":"linear-equations","passage":"x/3 − 2 = 5","stem":"What is the value of x?","choices":["9","1","21","7"],"answer":"C","expl":"x/3 = 7 → x = 21. Undo the −2 first, then the ÷3."},{"id":"drill03:M3","bankId":"drill03","section":"M","domain":"Algebra","skill":"Interpreting linear models","diff":"M","_lesson":"linear-models","passage":"A phone plan costs 25 + 0.05t dollars per month, where t is the number of texts sent beyond the plan's limit.","stem":"What does the number 0.05 represent?","choices":["The fixed monthly fee","The number of texts included in the plan","The cost of each text beyond the limit","The total monthly cost"],"answer":"C","expl":"0.05 multiplies t → it's the per-text rate. 25 is the fixed fee."},{"id":"drill03:M4","bankId":"drill03","section":"M","domain":"Algebra","skill":"Linear functions from two points","diff":"M","_lesson":"slope-two-points","passage":"A line passes through (0, −3) and (2, 5).","stem":"Which equation defines the line?","choices":["y = 4x + 3","y = 2x − 3","y = 4x − 3","y = 8x − 3"],"answer":"C","expl":"Slope = (5 − (−3))/(2 − 0) = 4; the y-intercept is given by (0, −3) → y = 4x − 3."},{"id":"drill03:M5","bankId":"drill03","section":"M","domain":"Algebra","skill":"Slope (parallel lines)","diff":"H","_lesson":"slope-two-points","passage":"Line l is y = −2x + 7.","stem":"Which line is parallel to l and passes through (3, −1)?","choices":["y = 2x − 7","y = −2x + 5","y = −2x − 1","y = ½x − 2.5"],"answer":"B","expl":"Parallel → same slope −2. Through (3, −1): −1 = −2(3) + b → b = 5."},{"id":"drill03:M6","bankId":"drill03","section":"M","domain":"Algebra","skill":"Systems of linear equations","diff":"M","_lesson":"linear-equations","passage":"3x + y = 14 and x − y = 2","stem":"What is the value of y?","choices":["4","6","2","10"],"answer":"C","expl":"Add: 4x = 16 → x = 4 → y = 14 − 12 = 2. The question asks for y, not x."},{"id":"drill03:M7","bankId":"drill03","section":"M","domain":"Algebra","skill":"Linear inequalities (solving)","diff":"M","_lesson":"inequalities","passage":"5x − 7 > 18","stem":"Which describes all solutions?","choices":["x \u003c 5","x > 5","x > 2.2","x ≥ 5"],"answer":"B","expl":"5x > 25 → x > 5. Strict inequality stays strict."},{"id":"drill03:M8","bankId":"drill03","section":"M","domain":"Advanced Math","skill":"Exponent rules (power of a power)","diff":"M","_lesson":"exponent-rules","passage":"(x²)⁵ · x","stem":"The expression is equivalent to which of the following?","choices":["x¹⁰","x⁷","x⁸","x¹¹"],"answer":"D","expl":"(x²)⁵ = x¹⁰; times x¹ → x¹¹."},{"id":"drill03:M9","bankId":"drill03","section":"M","domain":"Advanced Math","skill":"Exponential decay models","diff":"M","_lesson":"exponential-models","passage":"A car bought for $30,000 loses 10 percent of its value each year.","stem":"Which expression gives the car's value after t years?","choices":["30,000(0.1)^t","30,000 − 3,000t","30,000(0.9)^t","30,000(1.1)^t"],"answer":"C","expl":"Losing 10% keeps 90% each year → multiply by 0.9 per year. Subtracting 3,000t is linear, not percentage."},{"id":"drill03:M10","bankId":"drill03","section":"M","domain":"Advanced Math","skill":"Quadratic minimum (vertex)","diff":"H","_lesson":"quadratic-vertex","passage":"y = x² − 6x + 5","stem":"What is the minimum value of y?","choices":["5","−4","3","−9"],"answer":"B","expl":"Vertex at x = 6/2 = 3; y = 9 − 18 + 5 = −4. (3 is the x-coordinate, not the minimum.)"},{"id":"drill03:M11","bankId":"drill03","section":"M","domain":"Advanced Math","skill":"Factoring quadratics","diff":"M","_lesson":"quadratics-solving","passage":"x² − 7x + 12 = 0","stem":"What are the solutions?","choices":["−3 and −4","2 and 6","3 and 4","−2 and −6"],"answer":"C","expl":"Multiply to 12, add to −7: −3 and −4 → (x−3)(x−4) = 0 → x = 3 or 4."},{"id":"drill03:M12","bankId":"drill03","section":"M","domain":"Advanced Math","skill":"Function notation (solve for input)","diff":"M","_lesson":"function-notation","passage":"g(x) = 4x − 5","stem":"For what value of x is g(x) = 11?","choices":["39","4","1.5","16"],"answer":"B","expl":"4x − 5 = 11 → 4x = 16 → x = 4. (39 is g(11) — the reverse question.)"},{"id":"drill03:M13","bankId":"drill03","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Percent (discount)","diff":"E","_lesson":"percent","passage":"A $40 shirt is marked 30 percent off.","stem":"What is the sale price?","choices":["$12","$37","$30","$28"],"answer":"D","expl":"40 × 0.70 = 28. ($12 is the discount, not the price.)"},{"id":"drill03:M14","bankId":"drill03","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Ratios and proportions","diff":"M","_lesson":"ratios-rates","passage":"A recipe uses 2 cups of rice for every 3 cups of water.","stem":"How many cups of water are needed for 5 cups of rice?","choices":["6","10","7.5","3.33"],"answer":"C","expl":"2/3 = 5/x → 2x = 15 → x = 7.5."},{"id":"drill04:RW1","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Words in context (vocabulary)","diff":"E","_lesson":"vocab-in-context","passage":"The lecture was so ______ that half the audience was checking their phones within ten minutes.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["engaging","brief","tedious","technical"],"answer":"C","expl":"Phones out in ten minutes = boredom → tedious."},{"id":"drill04:RW2","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Words in context (contrast clue)","diff":"M","_lesson":"vocab-in-context","passage":"Far from ______ the new policy, the union's statement praised it as long overdue.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["endorsing","explaining","condemning","ignoring"],"answer":"C","expl":"“Far from X, it praised” → X is the opposite of praising: condemning."},{"id":"drill04:RW3","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Words in context (precision among near-synonyms)","diff":"H","_lesson":"vocab-in-context","passage":"The essay's argument is ______ but not persuasive: each step follows logically, yet the premises themselves are doubtful.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["original","coherent","emotional","brief"],"answer":"B","expl":"“Each step follows logically” defines coherent. Doubtful premises are why it still fails to persuade."},{"id":"drill04:RW4","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Words in context (vocabulary)","diff":"M","_lesson":"vocab-in-context","passage":"The town's water supply proved ______ during the drought; wells that had never failed ran dry by August.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["abundant","contaminated","expensive","unreliable"],"answer":"D","expl":"Wells running dry = the supply couldn't be counted on → unreliable. Nothing mentions contamination or cost."},{"id":"drill04:RW5","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Text structure and purpose","diff":"M","_lesson":"text-purpose","passage":"The passage opens with a vivid description of a crowded 1900 tenement before introducing the reformer who campaigned for housing laws.","stem":"The opening description mainly serves to","choices":["argue that tenements were pleasant places to live.","list the laws the reformer eventually passed.","establish the conditions the reformer set out to change.","compare housing in 1900 with housing today."],"answer":"C","expl":"Scene first, reformer second: the description sets up the problem the reformer addresses."},{"id":"drill04:RW6","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Text structure and purpose","diff":"H","_lesson":"text-purpose","passage":"Some readers take the poem's final line as consolation. Its placement after three stanzas of unanswered questions, however, suggests it is meant ironically.","stem":"Which choice best describes the function of the second sentence?","choices":["It supports the consoling reading with a new example.","It summarizes the poem's three stanzas.","It defines the term “irony.”","It challenges the consoling reading by pointing to the poem's structure."],"answer":"D","expl":"“However” + a structural observation (placement after unanswered questions) = evidence against the first reading."},{"id":"drill04:RW7","bankId":"drill04","section":"RW","domain":"Craft and Structure","skill":"Cross-text connections","diff":"H","_lesson":"cross-text","passage":["Text 1: An urban planner argues that adding lanes to congested highways relieves traffic.","Text 2: A transportation researcher observes that new lanes typically fill within a few years, because easier driving invites more trips — a pattern called induced demand."],"stem":"How would the researcher in Text 2 most likely respond to the planner's claim in Text 1?","choices":["By agreeing that new lanes permanently solve congestion.","By claiming that highways should be removed entirely.","By arguing that new lanes bring only temporary relief because they attract more driving.","By saying that congestion is not a real problem."],"answer":"C","expl":"Induced demand = relief, then refill. Text 2 qualifies Text 1 rather than agreeing or making a removal argument."},{"id":"drill04:RW8","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Central ideas (main idea)","diff":"E","_lesson":"central-ideas","passage":"Honeybees communicate the location of flowers through a “waggle dance”: the angle of the dance indicates direction relative to the sun, and its duration indicates distance.","stem":"Which choice best states the main idea of the text?","choices":["Bees dance for entertainment.","Bees cannot see the sun.","The waggle dance conveys both the direction and the distance of food.","Flowers attract bees with scent."],"answer":"C","expl":"Angle = direction, duration = distance — the dance encodes both. The rest contradict or invent."},{"id":"drill04:RW9","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Central ideas (literary text)","diff":"M","_lesson":"central-ideas","passage":"She folded the letter twice more than necessary, as though the creases could keep its contents from escaping.","stem":"The detail about the extra folds mainly suggests that she","choices":["is careless with paper.","wants to keep the letter's contents from getting out.","finds the letter too long.","plans to mail the letter immediately."],"answer":"B","expl":"“As though the creases could keep its contents from escaping” states the meaning: containment, secrecy."},{"id":"drill04:RW10","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Supporting details","diff":"M","_lesson":"central-ideas","passage":"Because lichens absorb moisture and nutrients directly from the air, they accumulate whatever pollutants the air carries. Scientists therefore use lichen surveys as a low-cost way to map air quality across a region.","stem":"According to the text, why are lichens useful for measuring air quality?","choices":["They grow only where the air is clean.","They are expensive to collect.","They live in water.","They take in airborne pollutants directly from the air."],"answer":"D","expl":"The “because” clause gives the reason: they absorb what the air carries."},{"id":"drill04:RW11","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Command of evidence (textual)","diff":"M","_lesson":"command-of-evidence","passage":"A nutritionist claims that eating breakfast improves students' morning concentration.","stem":"Which finding, if true, would most directly support the claim?","choices":["Most students prefer cereal to eggs.","Several schools recently added breakfast programs.","Students who ate breakfast scored higher on a 9 a.m. attention test than those who skipped it.","Breakfast foods are inexpensive."],"answer":"C","expl":"Concentration is the claim's variable; only the attention-test comparison measures it."},{"id":"drill04:RW12","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Command of evidence (quantitative)","diff":"H","_lesson":"command-of-evidence","passage":"A climatologist claims that the town's growing season has lengthened over recent decades.","table":{"headers":["Decade","Avg. last spring frost","Avg. first fall frost"],"rows":[["1990s","April 28","October 3"],["2000s","April 22","October 9"],["2010s","April 15","October 16"]]},"stem":"Which statement about the table best supports the claim?","choices":["The 2010s had the latest average first fall frost.","Frost dates vary from year to year.","The 1990s were colder than the 2010s.","The last spring frost moved earlier and the first fall frost moved later in each successive decade."],"answer":"D","expl":"A longer season means both ends moved outward. D captures the trend across all rows; A is one endpoint."},{"id":"drill04:RW13","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Inference (logical completion)","diff":"M","_lesson":"inference","passage":"Most of the library's overdue fines come from a small number of patrons who borrow dozens of items at once. When the library capped checkouts at ten items per person, ______","stem":"Which choice most logically completes the text?","choices":["fines increased across the board.","fewer residents applied for library cards.","total overdue fines fell sharply.","the library extended its loan periods."],"answer":"C","expl":"Cap the heavy borrowers who generate most fines → fines drop. The other outcomes have no support in the text."},{"id":"drill04:RW14","bankId":"drill04","section":"RW","domain":"Information and Ideas","skill":"Inference (synthesizing multiple clues)","diff":"H","_lesson":"inference","passage":"The fossil's teeth are worn flat, like those of grazing animals, yet its leg bones are built for speed, like a predator's. Paleontologists therefore suspect the animal ______","stem":"Which choice most logically completes the text?","choices":["hunted other animals.","lived entirely in water.","had no natural predators.","grazed on plants but relied on speed to escape predators."],"answer":"D","expl":"Flat teeth (plant-eater) + fast legs (needs to run) → a grazer that fled predators. D is the only choice using both clues."},{"id":"drill04:RW15","bankId":"drill04","section":"RW","domain":"Standard English Conventions","skill":"Subject–verb agreement (one of)","diff":"E","_lesson":"subject-verb","passage":"One of the paintings ______ already been sold.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["have","has","were","are"],"answer":"B","expl":"The subject is “one” (singular) — “of the paintings” is an interrupter → has."},{"id":"drill04:RW16","bankId":"drill04","section":"RW","domain":"Standard English Conventions","skill":"Subject–verb agreement (there is/are)","diff":"M","_lesson":"subject-verb","passage":"There ______ several reasons for the delay.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","was","are","has been"],"answer":"C","expl":"With “there,” the real subject comes after the verb: “reasons” (plural) → are."},{"id":"drill04:RW17","bankId":"drill04","section":"RW","domain":"Standard English Conventions","skill":"Dangling modifiers","diff":"M","_lesson":"modifiers","passage":"Covered in dust, ______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["years had passed since the books were touched.","nobody had touched the books in years.","the books had clearly not been touched in years.","the shelf's collection of books was untouched for years by anyone."],"answer":"C","expl":"What was covered in dust? The books — so “the books” must follow the comma."},{"id":"drill04:RW18","bankId":"drill04","section":"RW","domain":"Standard English Conventions","skill":"Punctuation (colon before a list)","diff":"M","_lesson":"punctuation","passage":"The recipe requires only three ______ flour, butter, and salt.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["ingredients;","ingredients,","ingredients:","ingredients"],"answer":"C","expl":"A complete sentence followed by the list it announces → colon."},{"id":"drill04:RW19","bankId":"drill04","section":"RW","domain":"Standard English Conventions","skill":"Relative pronouns","diff":"H","_lesson":"punctuation","passage":"The architect ______ designed the library also planned the adjoining park.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["whom","which","who","whose"],"answer":"C","expl":"A person doing the action (designed) → who. “Whom” is for objects; “which” is for things."},{"id":"drill04:RW20","bankId":"drill04","section":"RW","domain":"Standard English Conventions","skill":"Verb tense (present perfect)","diff":"M","_lesson":"verb-tense","passage":"Since 2015, the company ______ its workforce every single year.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["expanded","has expanded","expands","had expanded"],"answer":"B","expl":"“Since 2015” → an action continuing from the past into now: present perfect."},{"id":"drill04:RW21","bankId":"drill04","section":"RW","domain":"Expression of Ideas","skill":"Transitions (concession)","diff":"M","_lesson":"transitions","passage":"The trail is steep and rocky. ______ it offers the best views in the park.","stem":"Which choice completes the text with the most logical transition?","choices":["Therefore,","Even so,","For example,","Likewise,"],"answer":"B","expl":"Downside, then an upside that outweighs it → concession: Even so."},{"id":"drill04:RW22","bankId":"drill04","section":"RW","domain":"Expression of Ideas","skill":"Rhetorical synthesis (matching a stated goal)","diff":"M","_lesson":"rhetorical-synthesis","notes":["Ada Lovelace (1815–1852) was an English mathematician.","She wrote extensive notes on Charles Babbage's proposed Analytical Engine.","Her notes include what is widely considered the first computer program.","She was the daughter of the poet Lord Byron."],"stem":"The student wants to emphasize Lovelace's contribution to computing. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Ada Lovelace was born in 1815, the daughter of Lord Byron.","Ada Lovelace was an English mathematician.","Lovelace's notes on the Analytical Engine contain what is widely considered the first computer program.","Lord Byron was a famous poet."],"answer":"C","expl":"Contribution to computing = the first program. Birth year and parentage are off-goal."},{"id":"drill04:M1","bankId":"drill04","section":"M","domain":"Algebra","skill":"Linear equations in one variable","diff":"E","_lesson":"linear-equations","passage":"7 − 3x = −8","stem":"What is the value of x?","choices":["−5","1/3","5","15"],"answer":"C","expl":"−3x = −15 → x = 5."},{"id":"drill04:M2","bankId":"drill04","section":"M","domain":"Algebra","skill":"Interpreting linear models","diff":"M","_lesson":"linear-models","passage":"A tank drains according to V = 500 − 20t, where V is liters remaining after t minutes.","stem":"After how many minutes is the tank empty?","choices":["20","25","500","480"],"answer":"B","expl":"Set V = 0: 500 = 20t → t = 25."},{"id":"drill04:M3","bankId":"drill04","section":"M","domain":"Algebra","skill":"Linear functions from two points","diff":"H","_lesson":"slope-two-points","passage":"A line passes through (−2, 1) and (4, 4).","stem":"What is the y-intercept of the line?","choices":["1","3","2","−1"],"answer":"C","expl":"Slope = 3/6 = ½. Using (−2, 1): 1 = ½(−2) + b → b = 2. Check (4, 4): 2 + 2 = 4 ✓."},{"id":"drill04:M4","bankId":"drill04","section":"M","domain":"Algebra","skill":"Systems of linear equations (substitution)","diff":"M","_lesson":"linear-equations","passage":"y = 2x + 1 and y = −x + 7","stem":"What is the value of y at the solution?","choices":["2","3","5","7"],"answer":"C","expl":"2x + 1 = −x + 7 → 3x = 6 → x = 2 → y = 5."},{"id":"drill04:M5","bankId":"drill04","section":"M","domain":"Algebra","skill":"Linear inequalities from context","diff":"M","_lesson":"inequalities","passage":"A gym charges $30 per month plus $4 per class. Maria's monthly budget is $70.","stem":"What is the greatest number of classes Maria can take in a month?","choices":["17","9","11","10"],"answer":"D","expl":"30 + 4c ≤ 70 → c ≤ 10. (17 ignores the monthly fee.)"},{"id":"drill04:M6","bankId":"drill04","section":"M","domain":"Advanced Math","skill":"Exponent rules (power of a product)","diff":"H","_lesson":"exponent-rules","passage":"(3x²y)³","stem":"The expression is equivalent to which of the following?","choices":["9x⁶y³","27x⁵y⁴","27x⁶y³","3x⁶y³"],"answer":"C","expl":"The cube hits every factor: 3³ = 27, (x²)³ = x⁶, y³."},{"id":"drill04:M7","bankId":"drill04","section":"M","domain":"Advanced Math","skill":"Exponential growth models","diff":"M","_lesson":"exponential-models","passage":"A town of 1,200 people grows 5 percent per year.","stem":"Which expression gives the population after t years?","choices":["1,200 + 60t","1,200(1.05)^t","1,200(0.05)^t","1,200(5)^t"],"answer":"B","expl":"5% growth per year multiplies by 1.05 each year → 1,200(1.05)^t."},{"id":"drill04:M8","bankId":"drill04","section":"M","domain":"Advanced Math","skill":"Quadratic maximum (vertex)","diff":"M","_lesson":"quadratic-vertex","passage":"A ball's height is h = −5t² + 20t + 1 meters after t seconds.","stem":"At what time t does the ball reach its maximum height?","choices":["4","20","1","2"],"answer":"D","expl":"t = −b/2a = −20/(2·−5) = 2 seconds."},{"id":"drill04:M9","bankId":"drill04","section":"M","domain":"Advanced Math","skill":"Solving quadratic equations (factor out x)","diff":"M","_lesson":"quadratics-solving","passage":"x² = 9x","stem":"What are all solutions?","choices":["9 only","0 and 9","3 and −3","0 and 3"],"answer":"B","expl":"x² − 9x = 0 → x(x − 9) = 0 → x = 0 or 9. Dividing both sides by x loses the 0."},{"id":"drill04:M10","bankId":"drill04","section":"M","domain":"Advanced Math","skill":"Radical equations","diff":"H","_lesson":"radical-equations","passage":"√(2x + 3) = 5","stem":"What is the value of x?","choices":["14","4","22","11"],"answer":"D","expl":"Square both sides: 2x + 3 = 25 → x = 11. Check: √25 = 5 ✓."},{"id":"drill04:M11","bankId":"drill04","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Mean vs. median (effect of outliers)","diff":"M","_lesson":"stats-center","passage":"Test scores: 60, 70, 70, 80, 100","stem":"Which statement is true?","choices":["The median is greater than the mean.","The mean and median are equal.","The mean is greater than the median.","The mode is 100."],"answer":"C","expl":"Mean = 380/5 = 76; median = 70. The high score pulls the mean up."},{"id":"drill04:M12","bankId":"drill04","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Two-way tables and probability","diff":"M","_lesson":"two-way-tables","passage":"A survey of 150 students asked whether they play an instrument.","table":{"headers":["","Plays","Does not","Total"],"rows":[["9th grade","30","45","75"],["10th grade","40","35","75"],["Total","70","80","150"]]},"stem":"If one surveyed student is chosen at random, what is the probability the student is a 10th grader who plays an instrument?","choices":["8/15","4/15","40/75","70/150"],"answer":"B","expl":"40 out of the grand total 150 = 4/15. (40/75 is “given 10th grade.”)"},{"id":"drill04:M13","bankId":"drill04","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Ratios and proportions","diff":"E","_lesson":"ratios-rates","passage":"A car travels 180 miles on 6 gallons of gas.","stem":"How far can it travel on 10 gallons?","choices":["30","216","300","1,080"],"answer":"C","expl":"30 miles per gallon × 10 = 300."},{"id":"drill04:M14","bankId":"drill04","section":"M","domain":"Geometry and Trigonometry","skill":"Circles (diameter → area)","diff":"M","_lesson":"circles","passage":"The circle shown has a diameter of 10.","fig":"\u003csvg viewBox=\"0 0 200 150\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"100\" cy=\"75\" r=\"58\"/>\u003cline x1=\"42\" y1=\"75\" x2=\"158\" y2=\"75\"/>\u003ccircle cx=\"42\" cy=\"75\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"158\" cy=\"75\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/>\u003ctext x=\"100\" y=\"68\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">10\u003c/text>\u003c/svg>","stem":"What is the area of the circle?","choices":["100π","10π","5π","25π"],"answer":"D","expl":"Diameter 10 → radius 5 → area = π(5²) = 25π. Always halve the diameter first."},{"id":"drill04:M15","bankId":"drill04","section":"M","domain":"Geometry and Trigonometry","skill":"Pythagorean theorem (find a leg)","diff":"M","_lesson":"pythagorean","passage":"A 25-foot ladder leans against a wall with its base 7 feet from the wall.","fig":"\u003csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cline x1=\"60\" y1=\"20\" x2=\"60\" y2=\"180\"/>\u003cline x1=\"40\" y1=\"180\" x2=\"190\" y2=\"180\"/>\u003cline x1=\"105\" y1=\"180\" x2=\"60\" y2=\"30\"/>\u003cpath d=\"M60 168 L72 168 L72 180\" stroke-width=\"1\"/>\u003ctext x=\"95\" y=\"100\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">25\u003c/text>\u003ctext x=\"82\" y=\"195\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">7\u003c/text>\u003ctext x=\"46\" y=\"108\" fill=\"currentColor\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">?\u003c/text>\u003c/svg>","stem":"How high up the wall does the ladder reach, in feet?","choices":["18","26","24","√674"],"answer":"C","expl":"Finding a leg → subtract: √(25² − 7²) = √(625 − 49) = √576 = 24."},{"id":"drill04:M16","bankId":"drill04","section":"M","domain":"Geometry and Trigonometry","skill":"Right-triangle trig (tangent)","diff":"H","_lesson":"right-triangle-trig","passage":"In the right triangle, the side opposite angle A is 8 and the side adjacent to A is 15.","fig":"\u003csvg viewBox=\"0 0 210 170\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M25 145 L185 145 L185 60 Z\"/>\u003cpath d=\"M173 145 L173 133 L185 133\" stroke-width=\"1\"/>\u003cpath d=\"M53 145 A28 28 0 0 0 51 132\" stroke-width=\"1\"/>\u003ctext x=\"14\" y=\"150\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">A\u003c/text>\u003ctext x=\"105\" y=\"161\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">15\u003c/text>\u003ctext x=\"193\" y=\"108\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\">8\u003c/text>\u003c/svg>","stem":"What is tan A?","choices":["15/8","8/17","8/15","15/17"],"answer":"C","expl":"tan = opposite/adjacent = 8/15. (8/17 would be sin A, since the hypotenuse is 17.)"},{"id":"drill05:RW1","bankId":"drill05","section":"RW","domain":"Craft and Structure","skill":"Words in context (vocabulary)","diff":"E","_lesson":"vocab-in-context","passage":"The instructions were so ______ that even first-time users assembled the shelf in minutes.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["vague","lengthy","clear","technical"],"answer":"C","expl":"First-timers finishing in minutes = the instructions were clear."},{"id":"drill05:RW2","bankId":"drill05","section":"RW","domain":"Craft and Structure","skill":"Words in context (contrast clue)","diff":"M","_lesson":"vocab-in-context","passage":"Although the critic dismissed the film as ______, audiences found it fresh and surprising.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["innovative","moving","formulaic","expensive"],"answer":"C","expl":"“Although” contrasts the critic with “fresh and surprising” → the critic's word is the opposite: formulaic."},{"id":"drill05:RW3","bankId":"drill05","section":"RW","domain":"Craft and Structure","skill":"Words in context (colon = definition)","diff":"M","_lesson":"vocab-in-context","passage":"The scientist remained ______ about the early results: promising, she said, but far from proven.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["euphoric","dismissive","indifferent","cautious"],"answer":"D","expl":"“Promising but far from proven” is a careful, hedged stance → cautious. Not euphoric, not dismissive."},{"id":"drill05:RW4","bankId":"drill05","section":"RW","domain":"Craft and Structure","skill":"Words in context (precision among near-synonyms)","diff":"H","_lesson":"vocab-in-context","passage":"His apology was ______ rather than sincere: he said the right words, but in a tone that suggested he felt no regret.","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["heartfelt","perfunctory","lengthy","private"],"answer":"B","expl":"Right words, no feeling = going through the motions → perfunctory. “Heartfelt” is the opposite of what the colon describes."},{"id":"drill05:RW5","bankId":"drill05","section":"RW","domain":"Craft and Structure","skill":"Text structure and purpose","diff":"M","_lesson":"text-purpose","passage":"After describing several failed attempts to photograph the deep-sea squid, the author notes that the first successful image came from a camera left unattended on the seafloor for days.","stem":"The final sentence mainly serves to","choices":["explain how cameras function underwater.","argue that the squid cannot be photographed.","present the eventual success and contrast it with the earlier active attempts.","describe the squid's appearance."],"answer":"C","expl":"Failures, then a success that worked differently (unattended vs. active) — the sentence delivers the payoff and the contrast."},{"id":"drill05:RW6","bankId":"drill05","section":"RW","domain":"Craft and Structure","skill":"Cross-text connections","diff":"M","_lesson":"cross-text","passage":["Text 1: A dietitian says that skipping dinner helps people lose weight by cutting their daily calories.","Text 2: A sleep researcher finds that people who skip dinner often snack late at night, consuming more calories than the meal would have."],"stem":"How would the author of Text 2 most likely respond to the claim in Text 1?","choices":["Skipping dinner reliably cuts calories.","Skipping dinner can backfire by leading to late-night snacking.","Dinner is the most important meal of the day.","Sleep has nothing to do with eating."],"answer":"B","expl":"Text 2's finding undercuts the mechanism Text 1 relies on (fewer calories) — snacking replaces them."},{"id":"drill05:RW7","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Central ideas (main idea)","diff":"E","_lesson":"central-ideas","passage":"Glass frogs have translucent skin through which their organs are visible. Recent studies show that while sleeping they hide most of their red blood cells in the liver, making them nearly invisible against leaves.","stem":"Which choice best states the main idea of the text?","choices":["Glass frogs have no blood.","Frogs sleep on leaves.","Transparent skin is common in frogs.","Glass frogs become nearly invisible while sleeping by storing red blood cells in the liver."],"answer":"D","expl":"The finding is the mechanism: hiding blood cells → transparency. A and C contradict or overreach."},{"id":"drill05:RW8","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Central ideas (literary text)","diff":"M","_lesson":"central-ideas","passage":"He read the telegram three times, each time more slowly, as if the words might rearrange themselves into better news.","stem":"The description mainly suggests that he","choices":["finds the telegram hard to read.","is pleased by the telegram.","cannot read well.","is struggling to accept bad news."],"answer":"D","expl":"Rereading in hope the words change = refusing to accept what they say. The news is bad."},{"id":"drill05:RW9","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Supporting details","diff":"M","_lesson":"central-ideas","passage":"Unlike most metals, gallium melts at about 30°C — just above room temperature — so a solid piece will liquefy in a person's hand.","stem":"According to the text, why does gallium melt in a person's hand?","choices":["Human hands are unusually hot.","Gallium is a liquid at all temperatures.","Gallium reacts chemically with skin.","Its melting point is only slightly above room temperature."],"answer":"D","expl":"The dash clause gives the reason: melts at about 30°C, which body heat exceeds."},{"id":"drill05:RW10","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Command of evidence (textual)","diff":"M","_lesson":"command-of-evidence","passage":"A coach claims that stretching before practice reduces injuries.","stem":"Which finding, if true, would most directly support the coach's claim?","choices":["Players said stretching felt good.","Stretching takes about ten minutes.","Injuries on the team dropped by a third after a stretching routine began, while a comparable team's injuries were unchanged.","Professional teams also stretch."],"answer":"C","expl":"Injuries are the variable; the comparison team rules out a general trend. The others don't measure injuries."},{"id":"drill05:RW11","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Command of evidence (quantitative)","diff":"H","_lesson":"command-of-evidence","passage":"An economist claims that the town's tourism has become less seasonal.","table":{"headers":["Year","Summer visitors","Winter visitors"],"rows":[["2018","60,000","10,000"],["2021","58,000","22,000"],["2024","57,000","35,000"]]},"stem":"Which statement about the table best supports the economist's claim?","choices":["Summer visitors fell slightly.","2024 had the most total visitors.","Winter is colder than summer.","Winter visitors more than tripled while summer visitors stayed roughly flat, narrowing the seasonal gap."],"answer":"D","expl":"“Less seasonal” = the gap between seasons shrank. D states exactly that; B is about totals."},{"id":"drill05:RW12","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Inference (logical completion)","diff":"M","_lesson":"inference","passage":"The coffee shops near campus all close by 6 p.m.; the library, however, is busiest after 8 p.m. A new shop that stays open until midnight will therefore likely ______","stem":"Which choice most logically completes the text?","choices":["struggle to find customers.","have to close earlier than planned.","attract late-studying students the other shops miss.","lower its prices."],"answer":"C","expl":"Demand exists after 8 (library crowd) and no shop serves it — the late-night shop fills that gap."},{"id":"drill05:RW13","bankId":"drill05","section":"RW","domain":"Information and Ideas","skill":"Inference (synthesizing multiple clues)","diff":"H","_lesson":"inference","passage":"The manuscript's ink has faded unevenly: lines near the margins are pale while the center is dark. The pages also show water stains along the edges. Together these observations suggest the manuscript ______","stem":"Which choice most logically completes the text?","choices":["was written by two different authors.","is a modern forgery.","was never read.","was stored somewhere damp that affected its edges."],"answer":"D","expl":"Fading at the margins + water stains at the edges → moisture reached the edges. Only D uses both clues."},{"id":"drill05:RW14","bankId":"drill05","section":"RW","domain":"Standard English Conventions","skill":"Subject–verb agreement (each)","diff":"E","_lesson":"subject-verb","passage":"Each of the recipes ______ a different spice.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["use","using","uses","have used"],"answer":"C","expl":"“Each” is singular → uses. “Of the recipes” is an interrupter."},{"id":"drill05:RW15","bankId":"drill05","section":"RW","domain":"Standard English Conventions","skill":"Dangling modifiers","diff":"M","_lesson":"modifiers","passage":"Hoping to finish early, ______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the break was skipped by the students.","skipping the break seemed wise to the students.","the students' break was skipped.","the students skipped their break."],"answer":"D","expl":"Who was hoping? The students — they must come right after the comma."},{"id":"drill05:RW16","bankId":"drill05","section":"RW","domain":"Standard English Conventions","skill":"Sentence boundaries (joining independent clauses)","diff":"M","_lesson":"punctuation","passage":"The hikers packed water, snacks, and a first-aid ______ they forgot the map.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["kit,","kit","kit;","kit, and,"],"answer":"C","expl":"Two complete sentences → semicolon. A comma alone splices them."},{"id":"drill05:RW17","bankId":"drill05","section":"RW","domain":"Standard English Conventions","skill":"Punctuating nonrestrictive elements (dash pair)","diff":"H","_lesson":"punctuation","passage":"Her first novel — a sprawling tale of three generations ______ took eight years to write.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[",",";","—","(no punctuation)"],"answer":"C","expl":"The aside opened with a dash, so it must close with a dash. Matching pairs only."},{"id":"drill05:RW18","bankId":"drill05","section":"RW","domain":"Standard English Conventions","skill":"Verb tense (past perfect)","diff":"M","_lesson":"verb-tense","passage":"When the alarm finally sounded, everyone ______ already left the building.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["has","have","had","will have"],"answer":"C","expl":"Leaving happened before the alarm (both past) → past perfect: had left."},{"id":"drill05:RW19","bankId":"drill05","section":"RW","domain":"Expression of Ideas","skill":"Transitions (confirmation)","diff":"M","_lesson":"transitions","passage":"The company promised faster delivery. ______ packages now arrive two days sooner on average.","stem":"Which choice completes the text with the most logical transition?","choices":["However,","Indeed,","Otherwise,","In contrast,"],"answer":"B","expl":"The second sentence confirms the promise came true → Indeed."},{"id":"drill05:RW20","bankId":"drill05","section":"RW","domain":"Expression of Ideas","skill":"Rhetorical synthesis (explaining a process)","diff":"M","_lesson":"rhetorical-synthesis","notes":["Sea turtles return to the beach where they hatched to lay their own eggs.","They navigate using Earth's magnetic field.","Some travel thousands of miles to get there.","Artificial lights can disorient hatchlings."],"stem":"The student wants to explain how sea turtles find their way back to their hatching beach. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Sea turtles lay their eggs on beaches.","Artificial lights can disorient sea turtle hatchlings.","Some sea turtles travel thousands of miles.","Sea turtles return to their hatching beach by navigating with Earth's magnetic field, sometimes across thousands of miles."],"answer":"D","expl":"“How they find their way” = the navigation mechanism (magnetic field). D delivers it; the others are side facts."},{"id":"drill05:M1","bankId":"drill05","section":"M","domain":"Algebra","skill":"Linear equations (distribution)","diff":"M","_lesson":"linear-equations","passage":"4x − 3 = 2(x + 4)","stem":"What is the value of x?","choices":["5.5","2.5","11","4"],"answer":"A","expl":"4x − 3 = 2x + 8 → 2x = 11 → x = 5.5."},{"id":"drill05:M2","bankId":"drill05","section":"M","domain":"Algebra","skill":"Interpreting linear models (building)","diff":"E","_lesson":"linear-models","passage":"A plumber charges a $60 visit fee plus $45 per hour.","stem":"Which equation gives the cost C, in dollars, for a job lasting h hours?","choices":["C = 45 + 60h","C = 60 + 45h","C = 105h","C = 60h + 45"],"answer":"B","expl":"Fixed fee stands alone (60); the hourly rate multiplies h (45h)."},{"id":"drill05:M3","bankId":"drill05","section":"M","domain":"Algebra","skill":"Slope from two points","diff":"M","_lesson":"slope-two-points","passage":"The points (1, 2), (3, 8), and (5, 14) lie on the same line.","stem":"What is the slope of the line?","choices":["6","2","3","1/3"],"answer":"C","expl":"(8 − 2)/(3 − 1) = 6/2 = 3. Any two points give the same slope on a line."},{"id":"drill05:M4","bankId":"drill05","section":"M","domain":"Algebra","skill":"Systems (infinitely many solutions)","diff":"H","_lesson":"systems","passage":"2x + 4y = 10 and x + 2y = k","stem":"For what value of k does the system have infinitely many solutions?","choices":["10","2","5","0"],"answer":"C","expl":"Infinitely many solutions = the same line. Halve the first equation: x + 2y = 5, so k = 5."},{"id":"drill05:M5","bankId":"drill05","section":"M","domain":"Algebra","skill":"Linear inequalities (negative coefficient)","diff":"M","_lesson":"inequalities","passage":"−2x + 6 ≥ 0","stem":"Which describes all solutions?","choices":["x ≤ 3","x ≥ 3","x ≤ −3","x ≥ −3"],"answer":"A","expl":"−2x ≥ −6 → divide by −2 and FLIP the sign: x ≤ 3."},{"id":"drill05:M6","bankId":"drill05","section":"M","domain":"Advanced Math","skill":"Exponent rules (zero exponent)","diff":"M","_lesson":"exponent-rules","passage":"x⁸ / x⁸, where x ≠ 0","stem":"The expression is equal to","choices":["0","x","1","x¹⁶"],"answer":"C","expl":"x^(8−8) = x⁰ = 1. Anything (nonzero) to the zero power is 1."},{"id":"drill05:M7","bankId":"drill05","section":"M","domain":"Advanced Math","skill":"Exponential decay (half-life)","diff":"H","_lesson":"exponential-models","passage":"An 800-gram sample of a substance halves every 3 hours.","stem":"How many grams remain after 9 hours?","choices":["100","200","400","266.7"],"answer":"A","expl":"9 hours = 3 halvings: 800 → 400 → 200 → 100. (266.7 treats it as linear.)"},{"id":"drill05:M8","bankId":"drill05","section":"M","domain":"Advanced Math","skill":"Quadratic vertex (vertex form)","diff":"M","_lesson":"quadratic-vertex","passage":"y = −(x + 2)² + 5","stem":"What is the vertex of the parabola?","choices":["(2, 5)","(−2, −5)","(−2, 5)","(2, −5)"],"answer":"C","expl":"(x + 2) means h = −2; k = 5 → vertex (−2, 5). The negative out front only flips it downward."},{"id":"drill05:M9","bankId":"drill05","section":"M","domain":"Advanced Math","skill":"Factoring quadratics","diff":"H","_lesson":"quadratics-solving","passage":"x² − 2x − 15 = 0","stem":"What are the solutions?","choices":["−5 and 3","5 and −3","5 and 3","−5 and −3"],"answer":"B","expl":"Multiply to −15, add to −2: −5 and +3 → (x − 5)(x + 3) = 0 → x = 5 or −3."},{"id":"drill05:M10","bankId":"drill05","section":"M","domain":"Advanced Math","skill":"Function notation and evaluation","diff":"M","_lesson":"function-notation","passage":"f(x) = x² + 1","stem":"What is the value of f(3) − f(1)?","choices":["10","2","8","6"],"answer":"C","expl":"f(3) = 10, f(1) = 2 → 10 − 2 = 8."},{"id":"drill05:M11","bankId":"drill05","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Percent (successive changes)","diff":"M","_lesson":"percent","passage":"A store raises the price of a $50 item by 20 percent, then offers 20 percent off the new price.","stem":"What is the final price?","choices":["$50","$48","$52","$40"],"answer":"B","expl":"50 × 1.20 = 60; 60 × 0.80 = 48. Up 20% then down 20% does NOT return to the start."},{"id":"drill05:M12","bankId":"drill05","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Rates and unit conversion","diff":"M","_lesson":"ratios-rates","passage":"A pump moves 15 gallons every 4 minutes.","stem":"How many minutes does it take to move 90 gallons?","choices":["24","6","22.5","20"],"answer":"A","expl":"90/15 = 6 batches × 4 minutes = 24 minutes."},{"id":"drill05:M13","bankId":"drill05","section":"M","domain":"Problem-Solving and Data Analysis","skill":"Median","diff":"M","_lesson":"stats-center","passage":"Data set: 3, 5, 5, 6, 8, 9, 20","stem":"What is the median?","choices":["8","5","9","6"],"answer":"D","expl":"Seven values → the 4th is the median: 6. The 20 doesn't move it."},{"id":"drill05:M14","bankId":"drill05","section":"M","domain":"Geometry and Trigonometry","skill":"Triangle angle sum (isosceles)","diff":"M","_lesson":"triangle-basics","passage":"The triangle is isosceles: its two base angles are equal, each x°, and the top angle is 40°.","fig":"\u003csvg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M65 150 L155 150 L110 26 Z\"/>\u003ctext x=\"104\" y=\"54\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\">40°\u003c/text>\u003ctext x=\"72\" y=\"143\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\">x°\u003c/text>\u003ctext x=\"134\" y=\"143\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\">x°\u003c/text>\u003c/svg>","stem":"What is the value of x?","choices":["40","100","70","140"],"answer":"C","expl":"2x + 40 = 180 → 2x = 140 → x = 70."},{"id":"drill05:M15","bankId":"drill05","section":"M","domain":"Geometry and Trigonometry","skill":"Circles (circumference → radius)","diff":"M","_lesson":"circles","passage":"The circle shown has a circumference of 8π.","fig":"\u003csvg viewBox=\"0 0 200 150\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"100\" cy=\"75\" r=\"58\"/>\u003ccircle cx=\"100\" cy=\"75\" r=\"2.5\" fill=\"currentColor\" stroke=\"none\"/>\u003cline x1=\"100\" y1=\"75\" x2=\"158\" y2=\"75\"/>\u003ctext x=\"126\" y=\"68\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">r\u003c/text>\u003c/svg>","stem":"What is the radius of the circle?","choices":["8","16","2","4"],"answer":"D","expl":"C = 2πr = 8π → r = 4."},{"id":"drill05:M16","bankId":"drill05","section":"M","domain":"Geometry and Trigonometry","skill":"Right-triangle trig (sine from cosine)","diff":"H","_lesson":"right-triangle-trig","passage":"In the right triangle, the side adjacent to angle B is 12 and the hypotenuse is 13.","fig":"\u003csvg viewBox=\"0 0 210 170\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M25 145 L185 145 L185 78 Z\"/>\u003cpath d=\"M173 145 L173 133 L185 133\" stroke-width=\"1\"/>\u003cpath d=\"M53 145 A28 28 0 0 0 52 135\" stroke-width=\"1\"/>\u003ctext x=\"14\" y=\"150\" fill=\"currentColor\" stroke=\"none\" font-size=\"13\">B\u003c/text>\u003ctext x=\"105\" y=\"161\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">12\u003c/text>\u003ctext x=\"95\" y=\"102\" fill=\"currentColor\" stroke=\"none\" font-size=\"12\">13\u003c/text>\u003c/svg>","stem":"What is sin B?","choices":["13/12","12/5","5/13","13/5"],"answer":"C","expl":"Adjacent 12, hypotenuse 13 → opposite = 5 (a 5-12-13). sin B = opposite/hypotenuse = 5/13."}];          // offline fallback pool (baked at build)
